allowBuilds:
  esbuild: false

autoInstallPeers: false

enableGlobalVirtualStore: false

ignoreWorkspaceRootCheck: true

linkWorkspacePackages: true

lockfileIncludeTarballUrl: true

minimumReleaseAge: 20160

minimumReleaseAgeExclude:
  - "@chalker/*"
  - "@exodus/stasis"
  - "@exodus/stasis-core"
  - "@exodus/stasis-plugins"
  - "@preventive/*"
  - "@rray/*"

modulesCacheMaxAge: 0

patchedDependencies:
  '@rray/frontend@1.0.0': patches/@rray__frontend@1.0.0.patch
  brotli@1.3.3: patches/brotli@1.3.3.patch

overrides:
  brotli>base64-js: "-"
