<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'none'">
<title>deepview results</title>
<link href="./view.css" rel="stylesheet" />
<script src="./view.js" type="module" defer></script>
</head>
<body>

<aside id="sidebar">
  <div class="sidebar-header">
    <button id="sidebar-toggle" type="button" title="toggle sidebar">≡</button>
    <h2>Reports</h2>
  </div>
  <ul id="file-list"></ul>
  <div class="sidebar-actions">
    <button id="delete-current" type="button" class="danger" title="delete the current report from storage">Delete</button>
  </div>
</aside>

<main id="main-content">
  <div id="drop-zone">
    <div class="drop-prompt">
      <h1>deepview results viewer</h1>
      <p>Drop a JSON results file here, or pick one from the sidebar</p>
    </div>
  </div>
  <div id="report"></div>
</main>

</body>
</html>
