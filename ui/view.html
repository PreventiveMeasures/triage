<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-1'; style-src 'unsafe-inline'; form-action 'none'">
<title>deepview results</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3;
  --muted: #8b949e; --accent: #58a6ff; --critical-bg: #3d1217; --critical: #f85149;
  --high: #f0883e; --medium: #d29922; --low: #8b949e; --green: #3fb950;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5;
  display: flex; height: 100vh; margin: 0; overflow: hidden;
}
a { color: var(--accent); text-decoration: none; }

/* sidebar — collapsible file list rooted in OPFS, persists across reloads.
   Pinned to the viewport (height: 100%; body is height: 100vh + overflow
   hidden, main scrolls instead). When OPFS has no entries AND nothing's
   currently loaded, the whole sidebar is hidden so the empty-state drop
   zone reads as a clean welcome screen. Collapsed state shrinks to a
   thin strip with just the toggle button so the user can always re-open
   it. Hidden in print. */
#sidebar {
  width: 240px; flex-shrink: 0; height: 100%;
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: width .15s ease-out;
  overflow: hidden;
}
#sidebar.collapsed { width: 32px; }
#sidebar.empty { display: none; }
.sidebar-header {
  display: flex; align-items: center; gap: .5rem;
  padding: .5rem .75rem; border-bottom: 1px solid var(--border);
}
.sidebar-header h2 {
  font-size: .85rem; font-weight: 600; flex: 1;
  white-space: nowrap; overflow: hidden;
}
#sidebar.collapsed .sidebar-header { padding: .5rem 0; justify-content: center; }
#sidebar.collapsed .sidebar-header h2,
#sidebar.collapsed #file-list,
#sidebar.collapsed .sidebar-actions { display: none; }
#sidebar-toggle {
  background: transparent; color: var(--text);
  border: 1px solid var(--border); border-radius: 4px;
  padding: .15rem .4rem; cursor: pointer; font-size: .85rem; font-family: inherit;
}
#sidebar-toggle:hover { border-color: var(--accent); }
#file-list { list-style: none; flex: 1; overflow-y: auto; padding: 0; margin: 0; }
.file-item button.file-name {
  display: block; width: 100%; text-align: left;
  padding: .4rem .75rem;
  background: transparent; color: var(--text);
  border: none; border-bottom: 1px solid var(--border);
  cursor: pointer; font-size: .8rem; font-family: inherit;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.file-item button.file-name:hover { background: #1a2233; }
.file-item.current button.file-name { background: #1a2233; color: var(--accent); }
.sidebar-actions {
  padding: .5rem .75rem; border-top: 1px solid var(--border);
  display: flex; gap: .35rem; flex-wrap: wrap;
}
.sidebar-actions button {
  background: transparent; border: 1px solid var(--border); color: var(--text);
  border-radius: 4px; padding: .25rem .55rem; cursor: pointer;
  font-size: .8rem; font-family: inherit;
}
.sidebar-actions button:hover { border-color: var(--accent); }
.sidebar-actions button.danger:hover { border-color: var(--critical); color: var(--critical); }
.sidebar-actions button[disabled] { opacity: .4; cursor: not-allowed; border-color: var(--border) !important; color: var(--muted) !important; }

/* Main column scrolls independently of the sidebar — body is height-
   constrained + overflow hidden, so the report's tall finding lists
   only push this column, not the sidebar's file list. */
#main-content { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; }

/* drop zone */
#drop-zone {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  flex: 1; padding: 2rem;
}
#drop-zone.hover { background: #1a2233; }
.drop-prompt { text-align: center; color: var(--muted); }
.drop-prompt h1 { font-size: 1.4rem; margin-bottom: .5rem; color: var(--text); }
.drop-prompt p { font-size: .95rem; }

/* report */
#report { display: none; max-width: 1200px; margin: 0 auto; padding: 1.5rem; width: 100%; box-sizing: border-box; }
#report.active { display: block; }
#drop-zone.hidden { display: none; }

header { margin-bottom: 1rem; }
header h1 { font-size: 1.3rem; }
header .meta { color: var(--muted); font-size: .85rem; margin-top: .25rem; }

/* Top-level view switcher — Findings / Tree. Only rendered when the
   report has a tree block with more than one file (single-file
   reports don't gain anything from a tree view). */
.report-tabs {
  display: flex; gap: .25rem; margin-bottom: 1rem;
  border-bottom: 1px solid var(--border);
}
.report-tabs button {
  background: transparent; border: none; color: var(--muted);
  padding: .5rem 1rem; cursor: pointer;
  font-size: .9rem; font-family: inherit;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.report-tabs button:hover { color: var(--text); }
.report-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Tree view — one card per file with imports / imported-by / exports
   / hashes. In-page anchors link import names to their file's card so
   the user can navigate the graph by clicking. The SVG above the
   cards is a layered-DAG visualization (roots at top, leaves at the
   bottom, bezier edges). Both layers point at the same anchor scheme
   so clicking a node in the SVG scrolls to that file's card. */
/* Tree tab: force-directed canvas on the left, info sidebar on the
   right. Both share a fixed viewport height so they scroll
   independently without pushing the page. By default, files with no
   own findings AND no transitive findings (subtree clean) are hidden
   — keeps the visualization focused on what matters; toggle restores
   all. */
.tree-layout {
  display: flex; gap: 1rem;
  margin-bottom: 1rem;
  height: 80vh;
}
.tree-canvas {
  flex: 1; min-width: 0;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  overflow: hidden;
  display: flex; flex-direction: column;
}
/* Toolbar sits OUTSIDE the scroll wrapper so horizontal panning
   (when the SVG is wider than the canvas) doesn't drag the toolbar
   along with it. flex-shrink: 0 keeps it visible if vertical content
   overflows. */
.tree-canvas-toolbar {
  flex-shrink: 0;
  display: flex; align-items: center; gap: .75rem;
  padding: .4rem .6rem;
  background: linear-gradient(to bottom, rgba(255, 255, 255, .03), rgba(0, 0, 0, .15));
  border-bottom: 1px solid var(--border);
  font-size: .8rem; color: var(--muted);
}
.tree-canvas-toolbar label { display: inline-flex; align-items: center; gap: .3rem; cursor: pointer; user-select: none; }
.tree-canvas-toolbar input { margin: 0; cursor: pointer; }
.tree-canvas-toolbar .spacer { flex: 1; }
.tree-canvas-toolbar .icon-btn {
  background: transparent; border: 1px solid var(--border); color: var(--text);
  border-radius: 4px; padding: .2rem .45rem;
  cursor: pointer; font-size: .9rem; line-height: 1;
  font-family: inherit;
}
.tree-canvas-toolbar .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.tree-canvas-scroll {
  flex: 1; overflow: auto;
  background: radial-gradient(circle at 50% 40%, rgba(88, 166, 255, .04), transparent 60%);
}
.tree-canvas-svg { display: block; }

/* Fullscreen toggle: hides the report header / file-list sidebar /
   chrome margins so the graph (or any of the report tabs) fills the
   viewport. Tabs stay so the user can switch views without exiting.
   The exit affordance is the same toolbar button (toggle), and Esc
   also clears it (wired in JS). */
body.report-fullscreen #sidebar { display: none; }
body.report-fullscreen #report > header { display: none; }
body.report-fullscreen #report { max-width: none; padding: .5rem; }
body.report-fullscreen .tree-layout { height: calc(100vh - 80px); }
.tree-canvas-svg .edges path {
  stroke: var(--muted); stroke-width: 0.8; fill: none; opacity: .22;
  transition: stroke .12s, stroke-width .12s, opacity .12s;
}
.tree-canvas-svg .nodes circle.node-fill {
  cursor: pointer;
  transition: stroke .12s, opacity .12s, filter .12s;
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .35));
}
.tree-canvas-svg .nodes text {
  fill: var(--text); font-size: 10px; font-weight: 500;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  pointer-events: none;
  paint-order: stroke fill;
  stroke: rgba(13, 17, 23, .85); stroke-width: 3px; stroke-linejoin: round;
}
.tree-canvas-svg .nodes .tree-node { transition: opacity .12s; }
/* Hover spotlight: dim everything not connected to the hovered node. */
.tree-canvas-svg.hover-active .tree-node:not(.hover-self):not(.hover-related):not(.selected) { opacity: .12; }
.tree-canvas-svg.hover-active .edges path:not(.hover-edge) { opacity: .04; }
.tree-canvas-svg .edges path.hover-edge { stroke: var(--accent); stroke-width: 1.5; opacity: 1; }
.tree-canvas-svg .tree-node.hover-self circle.node-fill,
.tree-canvas-svg .tree-node:hover circle.node-fill {
  stroke: var(--text); stroke-width: 2;
  filter: drop-shadow(0 0 6px rgba(88, 166, 255, .55));
}
.tree-canvas-svg .tree-node.hover-related circle.node-fill { stroke: var(--accent); stroke-width: 1.5; }
.tree-canvas-svg .tree-node.selected circle.node-fill {
  stroke: var(--accent); stroke-width: 3;
  filter: drop-shadow(0 0 8px rgba(88, 166, 255, .65));
}

/* Right sidebar — file info on the currently selected node. */
.tree-info {
  width: 320px; flex-shrink: 0;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  overflow-y: auto; max-height: 80vh;
  font-size: .85rem;
}
.tree-info-empty {
  padding: 2rem 1rem; color: var(--muted); text-align: center; line-height: 1.5;
}
.tree-info-content { padding: .75rem; }
.tree-info-title {
  font-size: .9rem; font-weight: 600;
  word-break: break-all; margin-bottom: .5rem;
}
.tree-info-jump {
  background: transparent; border: 1px solid var(--border); color: var(--accent);
  border-radius: 4px; padding: .25rem .55rem; cursor: pointer;
  font-size: .75rem; font-family: inherit;
  margin-bottom: .75rem;
}
.tree-info-jump:hover { border-color: var(--accent); }
.tree-info-section { margin-top: .85rem; }
.tree-info-label {
  font-size: .65rem; text-transform: uppercase; letter-spacing: .05em;
  color: var(--muted); margin-bottom: .3rem;
}
.tree-info-empty-list { color: var(--muted); font-size: .8rem; font-style: italic; }
.tree-info-list {
  list-style: none; padding: 0; margin: 0;
  max-height: 220px; overflow-y: auto;
}
.tree-info-list li { padding: 0; }
.tree-info-list button {
  display: block; width: 100%; text-align: left;
  background: transparent; border: none; color: var(--accent);
  padding: .2rem .35rem; cursor: pointer;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
  font-size: .75rem;
  border-radius: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tree-info-list button:hover { background: #1a2233; }
.tree-info-list .external {
  display: block;
  padding: .2rem .35rem;
  color: var(--muted);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
  font-size: .75rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tree-view { display: flex; flex-direction: column; gap: .75rem; }
.tree-file {
  padding: .6rem .8rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  scroll-margin-top: 1rem;
}
.tree-file-header {
  font-size: .95rem; font-weight: 600; margin-bottom: .25rem; word-break: break-all;
  display: flex; flex-wrap: wrap; align-items: center; gap: .5rem;
}
.tree-file-header .name { flex: 1; min-width: 0; }
/* Per-file finding-count chips, one per non-zero severity. Same color
   palette as the per-finding badges. Pure label — clicks pass through
   to nothing; the user navigates via the imports / imported-by links. */
.tree-count-chips { display: inline-flex; gap: .25rem; flex-wrap: wrap; }
.tree-count-chip {
  display: inline-block; font-size: .65rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: .03em;
  padding: .1rem .4rem; border-radius: 3px; line-height: 1.3;
}
.tree-count-chip.critical { background: var(--critical); color: #fff; }
.tree-count-chip.high     { background: var(--high); color: #fff; }
.tree-count-chip.medium   { background: var(--medium); color: #000; }
.tree-count-chip.low      { background: var(--low); color: #000; }
.tree-hashes { font-size: .65rem; color: var(--muted); margin-bottom: .35rem; word-break: break-all; }
.tree-section { margin-top: .35rem; }
.tree-section-label {
  display: inline-block; min-width: 6rem;
  font-size: .7rem; color: var(--muted);
  text-transform: uppercase; letter-spacing: .04em;
  vertical-align: top;
}
.tree-section ul {
  display: inline-block; list-style: none;
  margin: 0; padding: 0; vertical-align: top;
}
.tree-section li { font-size: .85rem; padding: 0; line-height: 1.4; }
.tree-section a { color: var(--accent); }
.tree-section a:hover { text-decoration: underline; }
.tree-section .name { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: .8rem; }

/* toolbar */
.toolbar {
  display: flex; flex-direction: column; gap: .5rem;
  margin-bottom: 1rem; padding: .6rem .75rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  font-size: .825rem;
}
.toolbar-row {
  display: flex; gap: .75rem; flex-wrap: wrap; align-items: center;
}
.toolbar label { color: var(--muted); margin-right: .15rem; }
.toolbar select {
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 4px; padding: .25rem .4rem; font-size: .8rem; cursor: pointer;
}
.toolbar select:focus, .toolbar input:focus { border-color: var(--accent); outline: none; }
.toolbar input[type="text"] {
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 4px; padding: .25rem .4rem; font-size: .8rem; flex: 1; min-width: 8rem;
}
.toolbar .sep { border-left: 1px solid var(--border); height: 1.2rem; }
.toolbar .result-count { color: var(--muted); margin-left: auto; }

.stats { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
.stat {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: .6rem 1rem; font-size: .85rem; cursor: pointer; user-select: none;
  transition: border-color .15s;
}
.stat:hover, .stat.active { border-color: var(--accent); }
.stat.active { background: #1a2233; }
.stat strong { display: block; font-size: 1.2rem; }
/* Color-filter chips reuse `.stat` but carry a small swatch beside the
   label so the row looks distinct from the severity chips at a glance.
   Swatch colors mirror the mark-dot palette; `none` is an outlined
   circle to read as "no fill = unmarked". */
.stat-dot {
  display: inline-block; width: .7rem; height: .7rem;
  border-radius: 50%; margin-right: .3rem;
  vertical-align: middle; border: 1px solid var(--border);
}
.stat-dot-red   { background: #6b1820; }
.stat-dot-blue  { background: #1a2f5a; }
.stat-dot-green { background: #1a4a2a; }
.stat-dot-gray  { background: #2a2f37; }
.stat-dot-none  { background: transparent; border-style: dashed; }

/* file groups */
.file-group { margin-bottom: 1.25rem; }
.file-group.hidden { display: none; }
.file-header {
  font-size: .9rem; font-weight: 600; padding: .5rem .75rem;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px 6px 0 0; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
}
.file-header .count { user-select: none; }
.file-header:hover { border-color: var(--accent); }
.file-header a { color: var(--text); }
.file-header a:hover { color: var(--accent); }
.file-header .count { color: var(--muted); font-weight: 400; font-size: .8rem; }
.file-body { border: 1px solid var(--border); border-top: none; border-radius: 0 0 6px 6px; }
/* Flat mode (group by file = OFF): each dedup group renders inside a
   self-contained card. The card border replaces the per-finding
   border-bottom, and a header strip carries the FULL line row — file
   + line + exportName + run-meta — so every result reads as a complete
   unit. The in-body line-row is suppressed inside `.flat-group` so
   the same line/exportName/run-meta doesn't appear twice. Run-meta
   floats right via `margin-left: auto`. */
.flat-group { margin-bottom: 1rem; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.flat-group-loc {
  display: flex; flex-wrap: wrap; gap: .5rem; align-items: baseline;
  padding: .4rem .7rem; font-size: .85rem;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.flat-group-loc .file { color: var(--text); font-weight: 500; }
.flat-group-loc .file:hover { color: var(--accent); }
.flat-group-loc .line-num { color: var(--muted); font-size: .8rem; }
.flat-group-loc .meta { color: var(--muted); font-size: .8rem; }
.flat-group-loc .run-meta { color: var(--muted); font-size: .65rem; margin-left: auto; }
.flat-group .finding { border-bottom: none; }
.flat-group .finding .line-row { display: none; }

.finding {
  padding: .75rem; border-bottom: 1px solid var(--border);
  font-size: .875rem;
}
.finding:last-child { border-bottom: none; }
.finding.is-critical { background: var(--critical-bg); }
.finding.hidden { display: none; }
/* Manual marker colors — click a dot under a finding to tag it. Ordered
   after .is-critical so manual marks override the critical auto-bg.
   Red is deliberately hotter than --critical-bg so a user-marked
   finding stays visually distinct from auto-highlighted criticals.
   For dedup groups these apply ONLY when the group has a well-defined
   common color — i.e. non-conflict AND at least one annotated tab is
   colored, with every color-bearing annotated tab agreeing. See
   groupState() in JS; conflicts use .has-conflict instead. */
.finding.mark-red { background: #6b1820; }
.finding.mark-blue { background: #1a2f5a; }
.finding.mark-green { background: #1a4a2a; }
.finding.mark-gray { background: #2a2f37; }

/* Dedup groups whose annotated tabs disagree on color OR on deletion
   state — highlight the whole entry and (per spec) ignore each tab's
   `deleted` flag for rollup. Accent outline draws attention without
   claiming one specific color. See groupState() in JS. */
.finding.has-conflict { outline: 2px dashed var(--accent); outline-offset: -2px; }

/* Tab strip — shown only for multi-tab groups. Each tab is a severity
   badge + confidence label; colored tabs carry their own background so
   per-tab triage is visible without switching to that tab. See sortTabs()
   in JS for the order: colored first, then severity desc, then confidence
   desc. The first tab post-sort is the group's "primary" (default active,
   used for group-level sorting). Lives inside `.marks` (the action row
   at the bottom of a finding) on the left; `margin-right: auto` pushes
   it away from the mark-dots on the right. */
.finding .tabs {
  display: flex; gap: .25rem; flex-wrap: wrap;
}
.finding .marks .tabs { margin-right: auto; }
.finding .tab {
  background: transparent; color: var(--text);
  border: 1px solid var(--border); border-radius: 4px;
  padding: .2rem .5rem; font-size: .75rem; line-height: 1.3;
  cursor: pointer; display: inline-flex; align-items: center; gap: .35rem;
  font-family: inherit;
}
.finding .tab:hover { border-color: var(--accent); }
.finding .tab.active { border-color: var(--accent); background: #1a2233; }
.finding .tab.tab-mark-red   { background: #6b1820; border-color: #6b1820; }
.finding .tab.tab-mark-blue  { background: #1a2f5a; border-color: #1a2f5a; }
.finding .tab.tab-mark-green { background: #1a4a2a; border-color: #1a4a2a; }
.finding .tab.tab-mark-gray  { background: #2a2f37; border-color: #2a2f37; }
.finding .tab.tab-mark-red.active,
.finding .tab.tab-mark-blue.active,
.finding .tab.tab-mark-green.active,
.finding .tab.tab-mark-gray.active { border-color: var(--text); }
.finding .tab.tab-deleted .tab-label { text-decoration: line-through; opacity: .6; }
.finding .tab .tab-conf { color: var(--muted); font-size: .7rem; }
.finding .tab.tab-mark-red .tab-conf,
.finding .tab.tab-mark-blue .tab-conf,
.finding .tab.tab-mark-green .tab-conf,
.finding .tab.tab-mark-gray .tab-conf { color: var(--text); }

/* Per-tab body. Only the active tab is shown on screen — print CSS
   below overrides to show ALL tab bodies so paper output preserves
   the "multiple cases of one finding" framing. The 2-col grid here
   is what was previously on `.finding` itself. */
.finding .tab-body {
  display: none;
  grid-template-columns: auto 1fr;
  gap: .25rem .75rem;
}
.finding .tab-body.active { display: grid; }
/* Separator between stacked tab bodies — print-only. On screen only
   the active tab body is `display: grid`; others are `display: none`,
   so a `tab-body + tab-body` rule here would still paint a stray top
   border on the visible body whenever the user selects anything past
   the first tab. Keep the separator scoped to print, where every
   body is shown stacked and the divider actually separates them. */

.finding-left { align-self: start; text-align: center; min-width: 4rem; }
.badge {
  display: inline-block; font-size: .7rem; font-weight: 600; text-transform: uppercase;
  padding: .15rem .45rem; border-radius: 3px; letter-spacing: .03em; line-height: 1;
}
.badge.critical { background: var(--critical); color: #fff; }
.badge.high { background: var(--high); color: #fff; }
.badge.medium { background: var(--medium); color: #000; }
.badge.low { background: var(--low); color: #000; }
.conf-score { font-size: .75rem; color: var(--muted); margin-top: .3rem; }
.conf-score strong { color: var(--text); font-size: .85rem; }

.finding .desc { grid-column: 2; }
/* `line-num` is the `line N` / `(found analyzing X)` spans; the `hashes`
   block (`file: sha512… | tree: …`) is opt-in via the "metadata"
   toolbar checkbox. Line numbers are always shown — they're the
   minimum context needed to act on a finding. */
.finding .line-num { color: var(--muted); font-size: .8rem; }
/* line-num + run-meta share one row: line-num on the left, run-meta on
   the right (`analyzer · effort · exportsMode`). flex-wrap keeps long
   meta strings from overflowing on narrow viewports. In the file-
   grouped layout this row is suppressed inside the .finding card and
   re-rendered above it as a `.finding-loc` header (see the rule
   under .file-group below). */
.finding .line-row {
  display: flex; justify-content: space-between;
  align-items: baseline; gap: .5rem; flex-wrap: wrap;
}
.finding .run-meta { color: var(--muted); font-size: .65rem; }
.toolbar .checkbox-label { display: inline-flex; align-items: center; gap: .25rem; color: var(--muted); cursor: pointer; }
.toolbar .checkbox-label input { margin: 0; cursor: pointer; }
.finding .recommendation { color: var(--green); margin-top: .25rem; font-size: .825rem; grid-column: 2; }
.finding .conf-reason { color: var(--muted); font-size: .8rem; margin-top: .2rem; grid-column: 2; }
.finding .hashes { color: var(--muted); font-size: .75rem; margin-top: .2rem; grid-column: 2; word-break: break-all; display: none; }
#report.show-metadata .finding .hashes { display: block; }

/* Per-finding action row: tab strip (multi-tab groups only, on the
   left) + color dots + delete. Sits under the finding content.
   `justify-content: flex-end` right-aligns the dots when no tabs
   are present; when tabs are present, `.tabs { margin-right: auto }`
   (above) pushes them apart. Marks and deletions are persisted via
   localStorage (see saveTriage). Hidden on print. */
.finding .marks {
  display: flex; gap: .35rem; justify-content: flex-end;
  margin-top: .4rem; align-items: center;
}
.finding .marks .mark-dot {
  width: .9rem; height: .9rem; border-radius: 50%; border: 1px solid var(--border);
  padding: 0; cursor: pointer; opacity: .55; transition: opacity .1s, transform .1s;
}
.finding .marks .mark-dot:hover { opacity: 1; transform: scale(1.15); }
.finding .marks .mark-dot.active { opacity: 1; border-color: var(--text); }
.finding .marks .mark-dot-red   { background: #6b1820; }
.finding .marks .mark-dot-blue  { background: #1a2f5a; }
.finding .marks .mark-dot-green { background: #1a4a2a; }
.finding .marks .mark-dot-gray  { background: #2a2f37; }
.finding .marks .mark-x {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  border-radius: 3px; padding: 0 .35rem; font-size: .85rem; line-height: 1.1;
  cursor: pointer; margin-left: .25rem;
}
.finding .marks .mark-x:hover { color: var(--critical); border-color: var(--critical); }
/* Restore button — rendered in place of `mark-x` while in trash view.
   Green hover mirrors the semantic of "undo delete". */
.finding .marks .mark-restore {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  border-radius: 3px; padding: 0 .45rem; font-size: .75rem; line-height: 1.3;
  cursor: pointer; margin-left: .25rem;
}
.finding .marks .mark-restore:hover { color: var(--green); border-color: var(--green); }

/* Trash toggle — flips the render path from "non-deleted" to "deleted
   only". Active state uses the critical color to signal "not your
   normal view". */
.toolbar .trash-btn {
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 4px; padding: .25rem .55rem; font-size: .8rem; cursor: pointer;
}
.toolbar .trash-btn:hover { border-color: var(--accent); }
.toolbar .trash-btn.active { border-color: var(--critical); color: var(--critical); }

/* Findings shown in trash view carry `.deleted` as a semantic label
   (matches the user-facing notion of "marked as deleted"). The opacity
   nudge keeps the list readable while making clear these aren't
   active findings. */
.finding.deleted { opacity: 0.75; }

/* "Severity" / "Confidence" sub-captions below the values in the
   left column. Tiny by design — they're supporting metadata, not
   headings, so the badge / score stay the visual anchor. Centered
   to match `.finding-left { text-align: center }`. Print uses the
   same size; only the ink color differs (paler grey on white). */
.value-label {
  display: block;
  font-size: .45rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .04em;
  margin-top: .1rem;
  margin-bottom: .3rem;
  font-weight: 500;
}
.finding-left .value-label:last-child { margin-bottom: 0; }
/* "N of M" duplicate-case subhead is print-only — on screen the tab
   strip already conveys "this group has N tabs". */
.print-case-label { display: none; }

/* Print: strip interactive widgets and keep each finding on one page.
   The toolbar + stats + reset button are hidden because they're
   noise on paper; mark-dots and x-button likewise. Individual
   findings get `break-inside: avoid` so a finding won't be split
   across a page boundary (file-groups can span pages — a single
   file with many findings is more common than a finding long
   enough to need its own page). */
@media print {
  /* ~9pt root maps the rem-based screen sizes onto a tighter A4/Letter
     density than 11pt (body lands around 8pt, headings ~11.7pt, badges
     ~6.3pt). Trades a bit of readability for noticeably more findings
     per page on dense reports. */
  html { font-size: 9pt; }
  body { background: #fff; color: #000; line-height: 1.35; }
  .toolbar, .stats, .finding .marks { display: none !important; }
  #drop-zone, #sidebar { display: none !important; }
  body { display: block; }
  #report { max-width: none; padding: 0; }
  header h1 { font-size: 1.2rem; }
  .finding {
    break-inside: avoid; page-break-inside: avoid;
    padding: .45rem .25rem;
  }
  .finding.deleted { opacity: 1; }
  .file-header { break-after: avoid; page-break-after: avoid; font-size: .85rem; }
  /* Show every tab body stacked — keeps the "multiple cases of one
     finding" framing on paper. Tab buttons themselves are redundant
     here since every body is visible. */
  .finding .tabs { display: none !important; }
  .finding .tab-body { display: grid !important; }
  /* Visual separator between stacked tab bodies on paper. Kept inside
     the print block because on screen only the active body is visible
     (see the note above the screen-side rule) — outside of print, a
     `tab-body + tab-body` selector still paints on a later-selected
     body and shows up as a stray top border. */
  .finding .tab-body + .tab-body {
    margin-top: .5rem; padding-top: .5rem;
    border-top: 1px dashed #999;
  }

  /* Make duplicates obvious. A multi-case .finding gets a banner above
     the stacked cases ("Multiple reports of one finding") and each case-
     body carries an "N of M" subhead via `.print-case-label`, so a
     reader can both see at a glance that a group is duplicates and
     locate any specific case. No extra borders or background tints —
     the banner + per-case label do the work. */
  .finding.multi-case::before {
    content: "Multiple reports of one finding";
    display: block;
    font-size: .7rem;
    font-weight: 700;
    color: #555;
    text-transform: uppercase;
    letter-spacing: .06em;
    border-bottom: 1px solid #bbb;
    padding-bottom: .2rem;
    margin-bottom: .35rem;
  }
  .print-case-label {
    display: block;
    grid-column: 1 / -1;
    font-size: .65rem;
    font-weight: 600;
    color: #555;
    background: #eee;
    padding: .1rem .35rem;
    border-radius: 3px;
    margin-bottom: .25rem;
    letter-spacing: .04em;
  }

  /* Paper-friendly ink for the value-labels (`var(--muted)` from the
     screen palette is tuned for the dark UI background and looks
     washed out on white). Size and spacing inherit from the screen
     rule. */
  .value-label { color: #777; }

  /* Force the printer to render background colors. Browsers strip them
     by default ("color adjustment: economy") which is what was leaving
     the badges and labels black-and-white on paper. The both-name form
     covers WebKit/Blink (-webkit-) and the standard property, since
     some browsers still only ship the prefixed version. Scoped to the
     elements that actually carry print-relevant fills so we don't
     force every CSS background through the printer. */
  .badge, .print-case-label, .finding.multi-case::before {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Severity badges on white paper: the screen palette (saturated red /
     orange / amber / light grey) is tuned for the dark UI background and
     bleaches out on white. Override to vivid, ink-saturated variants —
     deep red, orange, amber, slate, all with white text — so the labels
     read as colored chips on print. The `!important` is here because
     the default `.badge.<sev>` rules carry the same specificity and we
     want the print palette to win regardless of source order. */
  .badge.critical { background: #a30b0f !important; color: #fff !important; }
  .badge.high     { background: #b8400a !important; color: #fff !important; }
  .badge.medium   { background: #855107 !important; color: #fff !important; }
  .badge.low      { background: #374151 !important; color: #fff !important; }
}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="sidebar-header">
    <button id="sidebar-toggle" type="button" title="toggle sidebar">≡</button>
    <h2>Reports</h2>
  </div>
  <ul id="file-list"></ul>
  <div class="sidebar-actions">
    <button id="delete-current" type="button" class="danger" title="delete the current report from storage">Delete</button>
  </div>
</aside>

<main id="main-content">
  <div id="drop-zone">
    <div class="drop-prompt">
      <h1>deepview results viewer</h1>
      <p>Drop a JSON results file here, or pick one from the sidebar</p>
    </div>
  </div>
  <div id="report"></div>
</main>

<script nonce="1">
'use strict'

const SEVERITY_ORDER = { critical: 4, high: 3, medium: 2, low: 1 }
const NODE_MODULES_RE = /(^|\/)node_modules\//
// Run-level meta fields that the analyzer emits at the top of each report
// (and that the deduplicate command stamps on each finding individually).
// `ingestReport` lifts any of these from the report header onto each
// finding at ingest, so the renderer can show per-finding mode info
// uniformly without branching on whether the file came from a
// deduplicated dump.
const META_FIELDS = ['type', 'model', 'think', 'effort', 'exportsMode']
// Persistent file storage backs the sidebar. OPFS — Origin Private
// File System — is the preferred layer (real files, larger quota); on
// origins where OPFS is unavailable (file://, older browsers) we
// transparently fall back to localStorage with each report stored
// gzipped + base64 under a fixed prefix. Both layers key by basename;
// filename collisions overwrite.
const OPFS_DIR = 'deepview-reports'
const LS_REPORT_PREFIX = 'deepview.report:'
// localStorage key for the last-viewed file — restored on page load so
// the user picks back up where they left off.
const LAST_FILE_KEY = 'deepview.lastFile'
const dropZone = document.getElementById('drop-zone')
const report = document.getElementById('report')
const sidebar = document.getElementById('sidebar')
const fileList = document.getElementById('file-list')

let opfsWarned = false
async function getOpfsDir() {
  try {
    const root = await navigator.storage.getDirectory()
    return await root.getDirectoryHandle(OPFS_DIR, { create: true })
  } catch (err) {
    if (!opfsWarned) {
      opfsWarned = true
      // file:// and older browsers reject OPFS. We fall back to gzipped
      // localStorage automatically; surface this once so a user wondering
      // about quota / size limits sees what's happening.
      console.warn('OPFS unavailable, falling back to gzipped localStorage (limited quota).', err)
    }
    return null
  }
}

// Compress / decompress JSON text via gzip + base64 for the localStorage
// fallback. CompressionStream / DecompressionStream are well supported
// (same primitive used by loadTriage / saveTriage). Base64 is the
// transport because localStorage values are strings.
async function gzipString(text) {
  const bytes = new TextEncoder().encode(text)
  const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))
  const arr = new Uint8Array(await new Response(stream).arrayBuffer())
  return arr.toBase64()
}
async function gunzipString(b64) {
  const bytes = Uint8Array.fromBase64(b64)
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))
  const arr = new Uint8Array(await new Response(stream).arrayBuffer())
  return new TextDecoder().decode(arr)
}

// Storage layer: try OPFS first (real files, large quota), fall back to
// gzipped localStorage when OPFS is unavailable. Each function probes
// OPFS once per call — caching is unnecessary because getDirectoryHandle
// is cheap. localStorage paths read/write a key prefixed with
// LS_REPORT_PREFIX; the file list is enumerated by scanning that prefix.
async function listFiles() {
  const dir = await getOpfsDir()
  if (dir) {
    const names = []
    for await (const [name] of dir.entries()) names.push(name)
    return names.sort()
  }
  const names = []
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i)
    if (key && key.startsWith(LS_REPORT_PREFIX)) names.push(key.slice(LS_REPORT_PREFIX.length))
  }
  return names.sort()
}

async function saveFile(name, content) {
  const dir = await getOpfsDir()
  if (dir) {
    // Remove first so a shorter overwrite shrinks the underlying file.
    try { await dir.removeEntry(name) } catch {}
    const fh = await dir.getFileHandle(name, { create: true })
    const writable = await fh.createWritable()
    await writable.write(content)
    await writable.close()
    return
  }
  const compressed = await gzipString(content)
  try {
    localStorage.setItem(LS_REPORT_PREFIX + name, compressed)
  } catch (err) {
    // Most likely QuotaExceededError. Re-throw so the drop handler can
    // surface a useful message to the user instead of silently dropping.
    throw new Error(`localStorage write failed for ${name}: ${err.message}`)
  }
}

async function readFile(name) {
  const dir = await getOpfsDir()
  if (dir) {
    const fh = await dir.getFileHandle(name)
    const file = await fh.getFile()
    return await file.text()
  }
  const compressed = localStorage.getItem(LS_REPORT_PREFIX + name)
  if (compressed === null) throw new Error(`File not found: ${name}`)
  return await gunzipString(compressed)
}

async function deleteFile(name) {
  const dir = await getOpfsDir()
  if (dir) {
    try { await dir.removeEntry(name) } catch {}
    return
  }
  localStorage.removeItem(LS_REPORT_PREFIX + name)
}

// Exactly one OPFS-backed report is active at a time — the sidebar
// switches between them; merging is gone. Headless callers
// (`window.__loadFile` from src/print.js) bypass OPFS and may call
// `ingestReport` repeatedly, in which case `reports` does accumulate
// (the print pipeline still merges that way). The renderer is shape-
// agnostic.
let reports = []
// Currently-displayed OPFS basename, or null when nothing is loaded
// (drop zone visible). Tracked separately from `reports` so the
// sidebar can highlight the active file even before render finishes.
let currentFile = null
// Top-level tab — 'findings' (default), 'tree' (force-directed graph
// with file info sidebar), or 'files' (the per-file cards listing).
// Tree / files tabs are only visible when the loaded report carries
// a `tree` block with more than one file; switching files / loading
// a tree-less report auto-falls back to 'findings' inside render().
let currentView = 'findings'
// Currently-selected file in the tree view's right sidebar; null = no
// selection (sidebar shows an empty hint). Cleared when switching to a
// different report.
let selectedTreeFile = null
// Toggle: include files with no own AND no transitive findings in the
// graph. Off by default — clean leaf utilities clutter the canvas
// without telling the reader anything they don't already know.
let treeShowAll = false
// Cache for the force-directed layout. Re-computing every render
// (e.g. on tab switch / sidebar selection) would be wasteful; keyed
// off the `tree` reference + the show-all toggle so a different
// report or a toggle change invalidates and re-runs.
let _treeLayoutCache = null
// Severity + color filters are multi-select: empty Set = "no filter, show
// everything" (selecting every option individually is equivalent — the
// predicate passes when every finding's value is in the Set). UI-wise
// each .stat card toggles membership independently; no single "all"
// sentinel. `filterColors` stores mark colors (`red|blue|green|gray`)
// plus the literal `'none'` for unmarked findings.
let filterSeverities = new Set()
let filterColors = new Set()
let filterSource = 'all'
let filterConfMin = 8
let filterConfMax = ''
let filterInclude = ''
let filterExclude = ''
let repoUrl = ''
let sortBy = 'file'
// Display toggle — orthogonal to filters (doesn't affect which findings
// show), so it lives outside resetFilters so a filter reset or a new
// report drop doesn't wipe it. Default off for a denser view; flip on
// to inspect the source-hash provenance.
//   showMetadata: `file: <sha> | tree: <sha>` hashes block
// (Line numbers + run-meta used to be gated by an analogous showLines
// toggle, dropped — they're the minimum context needed to act on a
// finding, so always shown.)
let showMetadata = false
// `groupByFile` true (default) renders findings under per-file headers —
// the original behavior, kept by default. When false, every dedup group
// renders flat in sort order with its own location label above it (file
// path + line), so the reader can scan results across files in pure
// severity/confidence/file order without the file-header chrome.
let groupByFile = true
// Per-finding manual annotations. Keyed by `tabKey(f)` = `f.id ?? String(f._id)`:
// the export's derived uuid when available (persists across reloads via
// localStorage), else a session-local numeric id (session-only). See
// saveTriage / loadTriage below — uuid-shaped keys round-trip through a
// single `deepview.triage` localStorage entry; numeric-_id keys do not.
//   markers:     Map<key, 'red' | 'blue' | 'green' | 'gray'>
//   deletedIds:  Set<key> — soft-deleted findings. Hidden from the main
//                view; the Trash button toggles a view that shows only
//                these, with a Restore button to undo.
//   showDeleted: when true, render only findings in `deletedIds`.
// Both are PER-TAB (i.e. per individual finding even within a dedup
// group). Group-level rollup is computed on demand in groupState() —
// mismatched colors across a group's tabs highlight the whole entry;
// matching colors apply to the whole card; deletion of any one tab in
// a conflict-free group flags the whole group.
let markers = new Map()
let deletedIds = new Set()
let showDeleted = false
let nextFindingId = 0
// Ephemeral per-render state — which tab is active within each dedup
// group. Keyed by `groupKey(g)` (the first member's tabKey), value is a
// tabKey within the group. Falls back to the sorted-primary tab when
// absent or when the stored tab no longer exists. Session-only; NOT
// persisted (it's a pure UI focus state, not triage).
let activeTabByGroup = new Map()

// ID helpers. Internally every `reports[].groups[i]` is a Finding[]
// (single-finding entries are wrapped at ingest, so code downstream
// never branches on "is it a group?"). `tabKey` identifies an
// individual tab (= finding); `groupKey` identifies the group as a
// whole — uses the first member so it survives tab-sort reordering.
function tabKey(f) { return f.id ?? String(f._id) }
function groupKey(group) { return tabKey(group[0]) }
function toGroup(entry) { return Array.isArray(entry) ? entry : [entry] }

// Tab sort order within a group: colored tabs first (drawing attention
// to already-triaged cases), then higher severity, then higher
// confidence. The first tab after sort is the group's "primary" — used
// as the default active tab AND as the representative for group-level
// sorting (file/severity/confidence dropdowns).
function sortTabs(group) {
  return [...group].sort((a, b) => {
    const aColored = markers.has(tabKey(a)) ? 1 : 0
    const bColored = markers.has(tabKey(b)) ? 1 : 0
    if (aColored !== bColored) return bColored - aColored
    const aSev = SEVERITY_ORDER[a.severity] || 0
    const bSev = SEVERITY_ORDER[b.severity] || 0
    if (aSev !== bSev) return bSev - aSev
    const aConf = a.confidence ?? -1
    const bConf = b.confidence ?? -1
    return bConf - aConf
  })
}

function primaryTab(group) { return sortTabs(group)[0] }

function activeTabFor(group) {
  const stored = activeTabByGroup.get(groupKey(group))
  if (stored) {
    const match = group.find((f) => tabKey(f) === stored)
    if (match) return match
  }
  return primaryTab(group)
}

// Group-level triage rollup. User spec:
//   1. A tab is "annotated" if it has a color AND/OR is deleted.
//      Unannotated tabs are neutral — they don't contribute to the
//      rollup and can never cause a conflict on their own.
//   2. Among annotated tabs, a conflict exists iff they disagree on
//      color OR on deletion state. "Disagree on color" means two or
//      more distinct non-null colors are present (a tab annotated
//      only via deletion, with no color, never conflicts with a
//      colored tab purely on the basis of its missing color). "Disagree
//      on deletion" means some annotated tabs are deleted and others
//      are not. Conflict → dashed outline on the card; per-tab colors
//      still render on each tab button; the group is kept in the main
//      view (never in trash).
//   3. Otherwise (consistent annotated tabs), the card takes the
//      common color (if any annotated tab is colored); any annotated
//      tab being deleted puts the whole group in trash.
//   4. Click handlers enforce the inverse — see the click handler below.
// Examples (where A/B/C are tabs in one dedup group):
//   A(green, deleted), B(), C()            → no conflict, in trash, A is green
//   A(green, deleted), B(deleted), C()     → no conflict, in trash, A is green
//   A(green, deleted), B(red), C()         → conflict (colors disagree)
//   A(green), B(blue), C()                 → conflict (colors disagree)
//   A(green, deleted), B(green), C()       → conflict (deleted disagrees)
function groupState(group) {
  const annotated = group
    .map((f) => ({ color: markers.get(tabKey(f)), deleted: deletedIds.has(tabKey(f)) }))
    .filter((t) => t.color !== undefined || t.deleted)
  const colors = new Set(annotated.map((t) => t.color).filter((c) => c !== undefined))
  const deletedStates = new Set(annotated.map((t) => t.deleted))
  const hasConflict = colors.size > 1 || deletedStates.size > 1
  const commonColor = !hasConflict && colors.size === 1 ? [...colors][0] : null
  const anyDeleted = annotated.some((t) => t.deleted)
  const allDeleted = annotated.length > 0 && annotated.every((t) => t.deleted)
  return {
    hasConflict, commonColor, anyDeleted, allDeleted,
    // Conflict groups are NEVER counted as deleted (per spec — the
    // group stays in the main view until the user resolves the
    // disagreement per-tab). When non-conflicting, anyDeleted ==
    // allDeleted on annotated tabs, so either form is equivalent.
    isDeleted: !hasConflict && anyDeleted,
  }
}

function isGroupDeleted(group) { return groupState(group).isDeleted }

function findGroupById(gid) {
  for (const r of reports) {
    for (const g of r.groups) if (groupKey(g) === gid) return g
  }
  return null
}

// --- Triage persistence --------------------------------------------------
// Markers + deletions survive page reload via `localStorage['deepview.triage']`.
// Payload shape: `{ <uuid>: { color?, deleted? } }` — one entry per
// triaged finding, color/deleted both optional (omitted when absent so
// a clean finding leaves no trace). JSON-encoded, brotli-compressed,
// base64-encoded. Only keys matching UUID_RE are stored — session-only
// numeric keys are filtered out so a fresh drop of the same report
// re-applies triage under stable ids.
const TRIAGE_KEY = 'deepview.triage'
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/iu

async function compressBrotli(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate'))
  return new Uint8Array(await new Response(stream).arrayBuffer())
}

async function decompressBrotli(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'))
  return new Uint8Array(await new Response(stream).arrayBuffer())
}

async function saveTriage() {
  try {
    const entries = {}
    for (const [k, color] of markers) {
      if (!UUID_RE.test(k)) continue
      entries[k] = { ...(entries[k] || {}), color }
    }
    for (const k of deletedIds) {
      if (!UUID_RE.test(k)) continue
      entries[k] = { ...(entries[k] || {}), deleted: true }
    }
    if (Object.keys(entries).length === 0) {
      localStorage.removeItem(TRIAGE_KEY)
      return
    }
    const bytes = new TextEncoder().encode(JSON.stringify(entries))
    const compressed = await compressBrotli(bytes)
    localStorage.setItem(TRIAGE_KEY, compressed.toBase64())
  } catch (err) {
    console.warn('Failed to save triage:', err)
  }
}

async function loadTriage() {
  try {
    const raw = localStorage.getItem(TRIAGE_KEY)
    if (!raw) return
    const compressed = Uint8Array.fromBase64(raw)
    const decompressed = await decompressBrotli(compressed)
    const entries = JSON.parse(new TextDecoder().decode(decompressed))
    for (const [k, v] of Object.entries(entries)) {
      if (v && v.color) markers.set(k, v.color)
      if (v && v.deleted) deletedIds.add(k)
    }
  } catch (err) {
    console.warn('Failed to load triage:', err)
  }
}

let loadPromise = loadTriage()

// Render the OPFS file list into the sidebar. Highlights the active
// file. Disables Delete when nothing's open. Hides the whole sidebar
// when there are no files AND nothing's currently loaded — keeps the
// empty-state drop zone uncluttered. Called after every state
// transition that could change the file list or current selection.
async function renderSidebar() {
  const names = await listFiles()
  sidebar.classList.toggle('empty', names.length === 0 && !currentFile)
  fileList.innerHTML = names.map((n) =>
    `<li class="file-item${n === currentFile ? ' current' : ''}" data-file="${esc(n)}"><button type="button" class="file-name" title="${esc(n)}">${esc(n)}</button></li>`,
  ).join('')
  const deleteBtn = document.getElementById('delete-current')
  if (deleteBtn) deleteBtn.disabled = !currentFile
}

// Sidebar event delegation: file-list click switches; Delete removes
// the current file; toggle collapses / expands.
sidebar.addEventListener('click', (e) => {
  const fileEl = e.target.closest('.file-item[data-file]')
  if (fileEl) {
    const name = fileEl.dataset.file
    if (name && name !== currentFile) switchToFile(name)
    return
  }
  if (e.target.closest('#delete-current')) {
    deleteCurrent()
    return
  }
  if (e.target.closest('#sidebar-toggle')) {
    sidebar.classList.toggle('collapsed')
    try { localStorage.setItem('deepview.sidebarCollapsed', sidebar.classList.contains('collapsed') ? '1' : '0') } catch {}
  }
})

// On boot: restore the sidebar collapse state, render the file list,
// and switch to the last-viewed file if it's still around. No file
// loaded → drop zone stays visible.
;(async () => {
  try {
    if (localStorage.getItem('deepview.sidebarCollapsed') === '1') sidebar.classList.add('collapsed')
  } catch {}
  await renderSidebar()
  let last = null
  try { last = localStorage.getItem(LAST_FILE_KEY) } catch {}
  if (last) {
    const names = await listFiles()
    if (names.includes(last)) await switchToFile(last)
  }
})()

function resetFilters() {
  filterSeverities = new Set()
  filterColors = new Set()
  filterSource = 'all'
  filterConfMin = 8
  filterConfMax = ''
  filterInclude = ''
  filterExclude = ''
  sortBy = 'file'
}

// Prevent default drag behavior everywhere. Drops anywhere on the page
// route through addFiles → OPFS save → switch view to the last dropped.
// The drop zone keeps its hover affordance for the empty-state case.
// Global Esc → exit fullscreen mode (mirrors what the toolbar's
// fullscreen-button toggle does, so the user has the canonical browser
// gesture for "give me my chrome back").
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.body.classList.contains('report-fullscreen')) {
    document.body.classList.remove('report-fullscreen')
  }
})

document.addEventListener('dragover', (e) => e.preventDefault())
document.addEventListener('drop', (e) => {
  e.preventDefault()
  if (e.target.closest('#drop-zone')) return // dropZone handler owns this
  addFiles(e.dataTransfer.files)
})

dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('hover') })
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'))
dropZone.addEventListener('drop', (e) => {
  e.preventDefault()
  dropZone.classList.remove('hover')
  addFiles(e.dataTransfer.files)
})

// Drag/drop entry point. Each file is read, persisted to OPFS (replacing
// any existing entry of the same name), and the LAST one becomes the
// active view. Multiple drops at once still all save, but only the
// final one renders — merging across files is no longer a thing in the
// UI; the user switches via the sidebar.
async function addFiles(files) {
  let last = null
  for (const file of files) {
    try {
      const content = await file.text()
      await saveFile(file.name, content)
      last = { name: file.name, content }
    } catch (err) {
      alert(`Failed to load ${file.name}: ${err.message}`)
    }
  }
  if (last) await switchToFile(last.name, last.content)
  await renderSidebar()
}

// Replace the active view with the named OPFS file. Pre-fetched
// `content` skips a redundant OPFS read (drop path passes it through).
async function switchToFile(name, content) {
  reports = []
  currentFile = name
  // Reset tree-tab state so the new report opens clean: no leftover
  // selection from the previous report's file list, and the layout
  // cache invalidates (a new tree → re-layout).
  selectedTreeFile = null
  _treeLayoutCache = null
  try { localStorage.setItem(LAST_FILE_KEY, name) } catch {}
  if (content === undefined) {
    try {
      content = await readFile(name)
    } catch (err) {
      alert(`Failed to read ${name}: ${err.message}`)
      currentFile = null
      await renderSidebar()
      return
    }
  }
  await ingestReport(name, content)
  await renderSidebar()
}

// Remove the current file from OPFS and close the view. Doesn't
// auto-switch to another — the user picks from the sidebar.
async function deleteCurrent() {
  if (!currentFile) return
  const name = currentFile
  await deleteFile(name)
  currentFile = null
  reports = []
  selectedTreeFile = null
  _treeLayoutCache = null
  try { localStorage.removeItem(LAST_FILE_KEY) } catch {}
  report.classList.remove('active')
  report.innerHTML = ''
  dropZone.classList.remove('hidden')
  document.title = 'deepview results'
  await renderSidebar()
}

// Pure parse + render path — no FileReader, no OPFS. Used both by
// switchToFile (after content is materialized) and by the headless
// print flow (`window.__loadFile`), so that flow can still merge
// multiple inputs by calling repeatedly.
function ingestReport(name, content) {
  return new Promise((resolve) => {
  ;(async () => {
    try {
      // Persistent triage (markers/deletedIds keyed by uuid) is loaded
      // once at module init; await it before rendering so the first
      // drop already shows stored marks/deletions for matching findings.
      await loadPromise
      const data = JSON.parse(content)
      // Reset filters whenever this is the first report in the current
      // view (cleared on switchToFile / deleteCurrent, accumulating in
      // the headless print flow). The auto-tune that follows uses the
      // same gate.
      const isFirst = reports.length === 0
      // Dedup by exporter-provided uuid id across ALL loaded reports.
      // Input entries are either a single Finding or a Finding[] (a
      // dedup group from an upstream pass). A new group is dropped if
      // ANY of its members' ids match a previously-seen id — one
      // overlap is enough to conclude "already loaded" (groups don't
      // split / reshape across reloads). Findings without an id (legacy
      // JSON or pre-uuid exports) can't be deduped and always pass through.
      const seenIds = new Set()
      for (const r of reports) {
        for (const g of r.groups) {
          for (const f of g) if (f.id) seenIds.add(f.id)
        }
      }
      const groups = []
      let dupeCount = 0
      for (const entry of (data.findings || [])) {
        const members = toGroup(entry)
        if (members.length === 0) continue
        const anyDupe = members.some((f) => f.id && seenIds.has(f.id))
        if (anyDupe) { dupeCount++; continue }
        // Stamp a session-local `_id` on each member as a fallback key
        // for findings that lack the exporter-provided uuid `id`.
        // `tabKey(f)` prefers `f.id` (persistent) and falls back to
        // `String(f._id)`. Register ids as we stamp so duplicate entries
        // WITHIN this drop are caught too. Also fill in run-level meta
        // (type / effort / exportsMode) from the report header — but
        // only when the finding has NO per-finding meta at all. A finding
        // that came out of the deduplicate command already has its own
        // per-source meta stamped (each source report's header projected
        // onto its findings); a missing field there means "that source
        // run didn't have it" and is intentional. Mixing in the dedup
        // dump's top-level meta would mask those gaps with the dedup
        // model's settings (e.g. printing effort=max on a finding whose
        // source run had no effort flag).
        const stamped = members.map((f) => {
          if (f.id) seenIds.add(f.id)
          const filled = { ...f, _id: nextFindingId++ }
          const hasOwnMeta = META_FIELDS.some((k) => filled[k] !== undefined)
          if (!hasOwnMeta) {
            for (const key of META_FIELDS) {
              if (data[key] !== undefined) filled[key] = data[key]
            }
          }
          return filled
        })
        groups.push(stamped)
      }
      if (dupeCount > 0) console.log(`${name}: skipped ${dupeCount} duplicate finding${dupeCount === 1 ? '' : 's'}`)
      reports.push({
        type: data.type || 'analysis',
        fileName: name,
        groups,
        // Per-file imports / exports / hashes from the analyzer dump
        // (stamped at JSON-export time). The renderer surfaces this as
        // a separate "Tree" tab when more than one file is present.
        tree: data.tree ?? null,
      })
      if (isFirst) {
        resetFilters()
        // Auto-tune the confidence floor so the initial view fits roughly
        // 25 groups. Step up from 6 → 7 → 8 until the visible count is
        // within budget; cap at 8 (the previous static default) — going
        // higher hides too much of the report unconditionally. Counts
        // groups, not tabs, matching the filter semantics (`g.some(...)`).
        const countAtMin = (min) => groups.reduce((n, g) =>
          n + (g.some((f) => f.confidence !== undefined && f.confidence >= min) ? 1 : 0), 0)
        if (countAtMin(6) <= 25) filterConfMin = 6
        else if (countAtMin(7) <= 25) filterConfMin = 7
        else filterConfMin = 8
      }
      render()
    } catch (err) {
      alert(`Failed to parse ${name}: ${err.message}`)
    }
    resolve()
  })()
  })
}

// Headless / automated entry point — parses + renders a JSON report
// in-process, no OPFS, no sidebar swap. Returned promise resolves when
// this file's render has run, so callers (the `print` command in
// src/print.js) can await loading of every input before triggering
// print. Repeated calls accumulate (the print pipeline still merges
// multiple inputs that way).
window.__loadFile = (name, content) => ingestReport(name, content)

// Headless filter override — used by the `print` command to apply
// CLI-supplied --severity / --confidence values AFTER all reports are
// loaded (the auto-tuned confidence floor from addReport's first-load
// heuristic gets overridden here when present). `severities` may be an
// array (or null/undefined to leave unchanged); empty array clears the
// filter so all severities show.
window.__setFilters = ({ severities, confMin } = {}) => {
  if (severities !== undefined && severities !== null) filterSeverities = new Set(severities)
  if (confMin !== undefined) filterConfMin = confMin
  render()
}

function esc(str) {
  const el = document.createElement('span')
  el.textContent = str
  return el.innerHTML
}

function isModule(file) { return NODE_MODULES_RE.test(file) }

// Strip the `node_modules/<pkg>/` prefix so the path is rooted at the
// package's repo root — `node_modules/lodash/lib/foo.js` → `lib/foo.js`,
// `node_modules/@org/pkg/sub/x.js` → `sub/x.js`. Greedy `.*\/` runs to
// the LAST `/node_modules/` so nested layouts strip the innermost
// package, matching the package-name extraction at export time.
function stripPackagePrefix(file) {
  return file.match(/^(?:.*\/)?node_modules\/(?:@[^/]+\/[^/]+|[^/]+)\/(.*)$/u)?.[1] ?? file
}

// `githubRepo` (the per-finding `repo.github` value, e.g. `lodash/lodash`)
// wins over the user-typed repo URL when available — it points at the
// actual upstream of a node_modules dependency rather than at the project
// repo, which doesn't carry node_modules sources. Falls back to the
// user-typed repoUrl for own-source files (and when no per-finding repo
// is known).
function fileUrl(file, githubRepo) {
  if (githubRepo) return `https://github.com/${githubRepo}/blob/HEAD/${stripPackagePrefix(file)}`
  if (!repoUrl || isModule(file)) return null
  const base = repoUrl.replace(/\/$/u, '')
  return `${base}/blob/HEAD/${file}`
}

function fileLink(file, githubRepo) {
  const url = fileUrl(file, githubRepo)
  return url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(file)}</a>` : esc(file)
}

function lineLink(file, line, githubRepo) {
  const url = fileUrl(file, githubRepo)
  const text = `line ${esc(String(line))}`
  if (!url) return text
  const lineNum = parseInt(line, 10)
  return `<a href="${esc(url)}#L${lineNum}" target="_blank" rel="noopener">${text}</a>`
}

// Strip `[export: <name>]` markers from prose when they match the
// finding's own `exportName`. Isolate-mode injects these markers into
// every finding/CRITICAL line of a merged per-file response so the
// merge stays traceable to individual exports (see src/isolate.js),
// but once post-process has lifted the name out into `f.exportName`
// the inline marker just duplicates metadata already on the finding.
// Markers whose name does NOT match `f.exportName` are left alone —
// they're still useful context (e.g. "this export affects <other>").
function stripExportMarker(text, exportName) {
  if (!exportName || !text) return text
  const escaped = exportName.replace(/[.*+?^${}()|[\]\\]/gu, '\\$&')
  return text.replaceAll(new RegExp(`\\[export:\\s*${escaped}\\]\\s*`, 'gu'), '')
}

function findingText(f) {
  return [f.file, f.description, f.recommendation, f.confidenceReason, f.discoveredIn].filter(Boolean).join('\n').toLowerCase()
}

function prettyModel(model) {
  if (!model) return model
  return model.replace(/^[^/]+\//u, '').replace(/^claude-/, '').replaceAll('-', ' ')
}

// Per-tab filter predicate. Factored out so `applyFilters` (group-level)
// can ask "does ANY tab in this group match?" — per the user spec,
// one matching tab keeps the whole group visible.
function matchesFilters(f) {
  const inc = filterInclude.toLowerCase()
  const exc = filterExclude.toLowerCase()
  // Severity + color filters are multi-select Sets: empty = no filter,
  // non-empty = membership required. Unmarked tabs are bucketed under
  // the literal `'none'` so the user can isolate unreviewed findings by
  // ticking only that chip.
  if (filterSeverities.size > 0 && !filterSeverities.has(f.severity)) return false
  if (filterColors.size > 0) {
    const col = markers.get(tabKey(f)) ?? 'none'
    if (!filterColors.has(col)) return false
  }
  if (filterSource === 'own' && isModule(f.file)) return false
  if (filterSource === 'modules' && !isModule(f.file)) return false
  if (filterConfMin !== '' && (f.confidence === undefined || f.confidence < filterConfMin)) return false
  if (filterConfMax !== '' && (f.confidence === undefined || f.confidence > filterConfMax)) return false
  if (inc) { const text = findingText(f); if (!text.includes(inc)) return false }
  if (exc) { const text = findingText(f); if (text.includes(exc)) return false }
  return true
}

function applyFilters(groups) {
  return groups.filter((g) => g.some(matchesFilters))
}

// Group-level sort. For severity/confidence modes we compare on each
// group's primary tab (see sortTabs / primaryTab). 'file' sort is
// handled by the grouping below.
function applySorting(groups) {
  const sorted = [...groups]
  if (sortBy === 'severity') {
    sorted.sort((a, b) => {
      const pa = primaryTab(a), pb = primaryTab(b)
      return (SEVERITY_ORDER[pb.severity] || 0) - (SEVERITY_ORDER[pa.severity] || 0)
        || pa.file.localeCompare(pb.file)
        || parseInt(pa.line) - parseInt(pb.line)
    })
  } else if (sortBy === 'confidence-desc') {
    sorted.sort((a, b) => {
      const pa = primaryTab(a), pb = primaryTab(b)
      return (pb.confidence ?? -1) - (pa.confidence ?? -1) || pa.file.localeCompare(pb.file)
    })
  } else if (sortBy === 'confidence-asc') {
    sorted.sort((a, b) => {
      const pa = primaryTab(a), pb = primaryTab(b)
      return (pa.confidence ?? 11) - (pb.confidence ?? 11) || pa.file.localeCompare(pb.file)
    })
  }
  return sorted
}

// Render a single tab button. Shows the tab's severity badge + conf, and
// carries its own color / deleted classes so per-tab triage is visible
// from the group header.
function renderTab(f, isActive) {
  const key = tabKey(f)
  const color = markers.get(key)
  const deleted = deletedIds.has(key)
  const classes = ['tab']
  if (isActive) classes.push('active')
  if (color) classes.push(`tab-mark-${color}`)
  if (deleted) classes.push('tab-deleted')
  const confPart = f.confidence !== undefined ? `<span class="tab-conf">${f.confidence}/10</span>` : ''
  return `<button type="button" class="${classes.join(' ')}" data-tid="${esc(key)}"><span class="tab-label"><span class="badge ${esc(f.severity)}">${esc(f.severity)}</span> ${confPart}</span></button>`
}

// Render one tab's body (finding-left + content). Only the active tab
// body is shown on screen (CSS `.tab-body.active { display: grid }`);
// on print the CSS overrides to show every body stacked so paper output
// keeps all cases visible.
// `idx` / `total` feed the print-only "N of M" banner; on screen the tab
// strip already conveys group size, so `.print-case-label { display: none }`
// hides it. `.value-label` rows emit "Severity" / "Confidence" sub-captions
// below the badge / score on BOTH screen and paper — small enough to read
// as supporting metadata, big enough that someone unfamiliar with the UI
// conventions doesn't have to guess what a colored chip and a "5/10" mean.
function renderTabBody(f, isActive, idx = 0, total = 1) {
  const key = tabKey(f)
  let html = `<div class="tab-body${isActive ? ' active' : ''}" data-tid="${esc(key)}">`
  if (total > 1) html += `<div class="print-case-label">${idx + 1} of ${total}</div>`
  html += '<div class="finding-left">'
  // Sub-captions sit AFTER their values (below them visually).
  html += `<span class="badge ${esc(f.severity)}">${esc(f.severity)}</span>`
  html += '<div class="value-label">Severity</div>'
  if (f.confidence !== undefined) {
    html += `<div class="conf-score"><strong>${f.confidence}</strong>/10</div>`
    html += '<div class="value-label">Confidence</div>'
  }
  html += '</div>'
  html += '<div>'
  // `.line-row` flexes line numbers (left) against run-meta (right).
  // Empty `.run-meta` collapses so the line-num still sits flush left.
  // In file-grouped mode this row is hidden in favor of the per-finding
  // `.finding-loc` header above the card (CSS rule under .file-group).
  html += '<div class="line-row">'
  // Line number anchor + (when present) the export name the finding lives
  // in, comma-separated. The exportName is plain text — only the line
  // number gets linkified by `lineLink`. Pass `f.repo?.github` so a
  // node_modules finding links to the package's upstream repo rather
  // than the user-typed project URL.
  const exportPart = f.exportName ? `, ${esc(f.exportName)}` : ''
  html += `<span class="line-num">${lineLink(f.file, f.line, f.repo?.github)}${exportPart}</span>`
  if (f.discoveredIn) html += ` <span class="line-num">(found analyzing ${esc(f.discoveredIn)})</span>`
  const meta = [f.type, prettyModel(f.model), f.effort, f.exportsMode].filter(Boolean).join(' · ')
  if (meta) html += `<span class="run-meta">${esc(meta)}</span>`
  html += '</div>'
  html += `<div class="desc">${esc(stripExportMarker(f.description, f.exportName))}</div>`
  if (f.recommendation) html += `<div class="recommendation">Recommendation: ${esc(stripExportMarker(f.recommendation, f.exportName))}</div>`
  if (f.confidenceReason) html += `<div class="conf-reason">${esc(stripExportMarker(f.confidenceReason, f.exportName))}</div>`
  if (f.fileHash || f.treeHash) {
    const parts = []
    if (f.fileHash) parts.push(`file: ${esc(f.fileHash)}`)
    if (f.treeHash) parts.push(`tree: ${esc(f.treeHash)}`)
    html += `<div class="hashes">${parts.join(' | ')}</div>`
  }
  html += '</div></div>'
  return html
}

// Render one group as a `.finding` card. Group-level wrapper carries:
//   - `is-critical` if ANY tab is critical (matches filter semantics)
//   - `has-conflict` if tab colors disagree (accent outline, ignore deleted)
//   - `mark-<color>` if tabs share a common color (no conflict)
//   - `deleted` when in trash view (opacity nudge)
// Marks row at the bottom is group-level: color dots act on the active
// tab; delete acts on the whole group when conflict-free, on the active
// tab when conflicted. See click handler below for the inverse.
// File path → in-page anchor id. Replaces every non-word char with an
// underscore so paths with `/` `.` `@` (node_modules / scoped packages)
// produce valid id attributes.
function treeAnchor(file) {
  return 'tree-' + file.replace(/[^\w-]+/gu, '_')
}

// file → { critical, high, medium, low } finding-count map. Used by both
// the tree cards and the SVG visualization to surface findings density
// per file at a glance. Counts INDIVIDUAL findings (not groups) so the
// numbers match the per-file stats a user would otherwise scan in the
// findings view.
function computeFindingCountsByFile(allGroups) {
  const counts = new Map()
  for (const g of allGroups) {
    for (const f of g) {
      if (!counts.has(f.file)) counts.set(f.file, { critical: 0, high: 0, medium: 0, low: 0 })
      const c = counts.get(f.file)
      if (c[f.severity] !== undefined) c[f.severity]++
    }
  }
  return counts
}

// Short, distinguishing label for a node. Last two path segments —
// `lib/foo.js` from `src/lib/foo.js`, `queue/index.mjs` from
// `node_modules/@chalker/queue/index.mjs`. Full path is always
// available via the node's `<title>` tooltip and the linked card.
function svgNodeLabel(file, maxLen = 22) {
  const parts = file.split('/')
  const tail = parts.slice(-2).join('/')
  return tail.length <= maxLen ? tail : '…' + tail.slice(-(maxLen - 1))
}

// Sanitize file path → SVG-safe id. Used to cross-reference nodes and
// edges from the post-render hover-highlight wiring.
function svgNodeId(file) { return 'tn-' + file.replace(/[^\w-]+/gu, '_') }

// Numeric sort with a stable tiebreak — used by the barycenter passes
// below, where ties on the computed mean would otherwise depend on
// unstable browser sort behavior.
function byBary(bary) {
  return (a, b) => (bary.get(a) - bary.get(b)) || a.localeCompare(b)
}

// Group key for clustering + coloring nodes in the graph. npm packages
// stay grouped by package name. Own source (anything outside
// node_modules) groups by top-level directory — so `src/...` files all
// share a color, `playground/...` files share another. Files at the
// repo root cluster under '/' (rare).
function packageOf(file) {
  if (!file) return null
  const npm = file.match(/^(?:.*\/)?node_modules\/(@[^/]+\/[^/]+|[^/]+)/u)
  if (npm) return npm[1]
  const slash = file.indexOf('/')
  return slash > 0 ? file.slice(0, slash) : '/'
}

// Stable hue per package / dir name. Same group → same color across
// the canvas, so eyes can pick out clusters at a glance. Hash → HSL
// hue; saturation/lightness tuned for legibility on the dark theme.
// Falls back to a neutral blue for nameless input.
function packageColor(pkg) {
  if (!pkg) return 'hsl(208, 65%, 58%)'
  let h = 0
  for (const c of pkg) h = (h * 31 + c.charCodeAt(0)) | 0
  return `hsl(${((h % 360) + 360) % 360}, 60%, 56%)`
}

// Wrap a long basename across at most two lines. Splits at the last
// hyphen / underscore that keeps both halves under `maxLine`. If no
// suitable split exists, truncates with a trailing ellipsis. Returns
// an array of 1-2 strings ready to render as <text>/<tspan>.
function multiLineLabel(file, maxLine = 18) {
  const base = file.split('/').pop() ?? file
  if (base.length <= maxLine) return [base]
  const seps = []
  for (let i = 0; i < base.length; i++) if (base[i] === '-' || base[i] === '_') seps.push(i)
  if (seps.length === 0) return [base.slice(0, maxLine - 1) + '…']
  // Pick the split point closest to the middle that keeps both halves
  // within maxLine. Falls back to the most-balanced of any choice if
  // none fits cleanly (still better than mid-token truncation).
  const mid = base.length / 2
  let best = null
  for (const s of seps) {
    const a = s + 1, b = base.length - s - 1
    if (a > maxLine || b > maxLine) continue
    const score = Math.abs(s - mid)
    if (!best || score < best.score) best = { s, score }
  }
  if (!best) {
    // No clean split — pick the split with smallest max(a, b) and let
    // the longer side wrap visually rather than truncate the basename.
    for (const s of seps) {
      const max = Math.max(s + 1, base.length - s - 1)
      if (!best || max < best.max) best = { s, max }
    }
  }
  return [base.slice(0, best.s + 1), base.slice(best.s + 1)]
}

// transitive subtree finding counts: for each file, sum of own counts
// across every file reachable through its `imports` (recursively),
// excluding the file itself. Cycles handled by a visited set.
function computeTransitiveCounts(tree, ownCounts) {
  const transitive = new Map()
  for (const file of Object.keys(tree)) {
    const visited = new Set()
    const stack = [...((tree[file].imports ?? []).filter((i) => tree[i]))]
    while (stack.length > 0) {
      const dep = stack.pop()
      if (visited.has(dep)) continue
      visited.add(dep)
      for (const next of (tree[dep]?.imports ?? [])) if (tree[next]) stack.push(next)
    }
    const sum = { critical: 0, high: 0, medium: 0, low: 0 }
    for (const f of visited) {
      const c = ownCounts.get(f)
      if (c) for (const k of ['critical', 'high', 'medium', 'low']) sum[k] += c[k]
    }
    transitive.set(file, sum)
  }
  return transitive
}

// Has-issues predicate: own findings OR something in its subtree has
// findings. Used to filter out clean files when `treeShowAll` is off.
function fileHasFindings(file, ownCounts, transitiveCounts) {
  const own = ownCounts.get(file)
  const tr = transitiveCounts.get(file)
  const total = (c) => c ? c.critical + c.high + c.medium + c.low : 0
  return total(own) > 0 || total(tr) > 0
}

// Fruchterman-Reingold force-directed layout. Returns nodes with
// {file, x, y}. O(N²) per iteration — fine for the typical analyzer
// output (dozens to a few hundred files); for thousands a Barnes-Hut
// quadtree would be needed. Initial positions seeded from a per-file
// hash so re-renders produce the same layout (no jitter on tab switch).
//
// Three forces:
//   - Repulsion between every pair (Coulomb-like, k²/d).
//   - Attraction along edges (spring-like, d²/k).
//   - Per-package centroid pull (slight) so files from the same npm
//     package cluster visually instead of scattering.
//
// Cooling shrinks per-iter displacement geometrically so the layout
// settles instead of oscillating.
function forceLayout(files, importsOf) {
  const N = files.length
  const width = 1100, height = 760
  const k = Math.sqrt((width * height) / Math.max(N, 1)) * 0.9

  const seed = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return h }
  const nodes = files.map((file) => {
    const h = seed(file)
    return {
      file,
      x: width / 2 + Math.cos(h * 0.013) * (width / 3) + (((h % 100) - 50) * 0.6),
      y: height / 2 + Math.sin(h * 0.013) * (height / 3) + (((h >> 7) % 100 - 50) * 0.6),
      dx: 0, dy: 0,
    }
  })
  const idx = new Map(nodes.map((n, i) => [n.file, i]))

  const edges = []
  for (const f of files) {
    for (const imp of importsOf.get(f) ?? []) {
      if (idx.has(imp)) edges.push([idx.get(f), idx.get(imp)])
    }
  }

  // Group node indices by package for the centroid pull.
  const byPkg = new Map()
  for (let i = 0; i < N; i++) {
    const p = packageOf(nodes[i].file) ?? '__own__'
    if (!byPkg.has(p)) byPkg.set(p, [])
    byPkg.get(p).push(i)
  }

  const iterations = Math.min(400, Math.max(150, 80 + N * 2))
  const tempInit = width / 8
  const tempFinal = 0.5

  for (let iter = 0; iter < iterations; iter++) {
    const t = tempInit * Math.pow(tempFinal / tempInit, iter / iterations)
    for (const n of nodes) { n.dx = 0; n.dy = 0 }

    // Repulsion: every pair pushes away inversely proportional to dist.
    for (let i = 0; i < N; i++) {
      for (let j = i + 1; j < N; j++) {
        const a = nodes[i], b = nodes[j]
        let dx = a.x - b.x, dy = a.y - b.y
        let dist = Math.sqrt(dx * dx + dy * dy)
        if (dist < 0.01) {
          // Co-located — give them a deterministic nudge so they separate.
          const h = seed(a.file + b.file)
          dx = ((h % 100) - 50) * 0.01 || 0.5
          dy = (((h >> 7) % 100) - 50) * 0.01 || 0.5
          dist = Math.sqrt(dx * dx + dy * dy)
        }
        const force = (k * k) / dist
        a.dx += (dx / dist) * force; a.dy += (dy / dist) * force
        b.dx -= (dx / dist) * force; b.dy -= (dy / dist) * force
      }
    }

    // Attraction: edges pull importer toward import (and vice versa).
    for (const [i, j] of edges) {
      const a = nodes[i], b = nodes[j]
      const dx = a.x - b.x, dy = a.y - b.y
      const dist = Math.sqrt(dx * dx + dy * dy) || 0.01
      const force = (dist * dist) / k
      a.dx -= (dx / dist) * force; a.dy -= (dy / dist) * force
      b.dx += (dx / dist) * force; b.dy += (dy / dist) * force
    }

    // Package centroid pull — gentle, so package mates stay loosely
    // grouped without overpowering the structural forces above.
    for (const [, indices] of byPkg) {
      if (indices.length < 2) continue
      let cx = 0, cy = 0
      for (const i of indices) { cx += nodes[i].x; cy += nodes[i].y }
      cx /= indices.length; cy /= indices.length
      for (const i of indices) {
        const n = nodes[i]
        n.dx += (cx - n.x) * 0.04
        n.dy += (cy - n.y) * 0.04
      }
    }

    // Apply with cooling, constrain inside the canvas.
    for (const n of nodes) {
      const disp = Math.sqrt(n.dx * n.dx + n.dy * n.dy) || 0.01
      n.x += (n.dx / disp) * Math.min(disp, t)
      n.y += (n.dy / disp) * Math.min(disp, t)
      n.x = Math.max(40, Math.min(width - 40, n.x))
      n.y = Math.max(40, Math.min(height - 40, n.y))
    }
  }

  return nodes
}

// Force-directed canvas + toolbar (show-all toggle). Filters out clean
// files when `treeShowAll` is off. Layout is cached on (tree, showAll)
// — invalidated when the user flips the toggle or loads a new report.
function renderTreeCanvas(tree, ownCounts, transitiveCounts) {
  const allFiles = Object.keys(tree)
  // Filter: skip files with no own AND no transitive findings unless
  // `treeShowAll` is on. Edges to/from filtered nodes don't render
  // (the importsOf map below restricts to surviving files).
  const files = treeShowAll
    ? allFiles
    : allFiles.filter((f) => fileHasFindings(f, ownCounts, transitiveCounts))
  const fileSet = new Set(files)

  const importsOf = new Map()
  const importedBy = new Map()
  for (const f of files) {
    const imps = (tree[f].imports ?? []).filter((i) => fileSet.has(i))
    importsOf.set(f, imps)
    for (const imp of imps) {
      if (!importedBy.has(imp)) importedBy.set(imp, [])
      importedBy.get(imp).push(f)
    }
  }

  const totalFindings = (counts) => counts ? counts.critical + counts.high + counts.medium + counts.low : 0
  const indicatorFor = (counts) => {
    if (!counts) return null
    const SEV = { critical: '#f85149', high: '#f0883e', medium: '#d29922', low: '#8b949e' }
