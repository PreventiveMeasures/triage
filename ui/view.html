<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deepview results</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3;
  --muted: #8b949e; --accent: #58a6ff; --critical-bg: #3d1217; --critical: #f85149;
  --high: #f0883e; --medium: #d29922; --low: #8b949e; --green: #3fb950;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
a { color: var(--accent); text-decoration: none; }

/* drop zone */
#drop-zone {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; padding: 2rem;
}
#drop-zone.hover { background: #1a2233; }
.drop-prompt { text-align: center; color: var(--muted); }
.drop-prompt h1 { font-size: 1.4rem; margin-bottom: .5rem; color: var(--text); }
.drop-prompt p { font-size: .95rem; }

/* report */
#report { display: none; max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
#report.active { display: block; }
#drop-zone.hidden { display: none; }

header { margin-bottom: 1rem; }
header h1 { font-size: 1.3rem; }
header .meta { color: var(--muted); font-size: .85rem; margin-top: .25rem; }

/* toolbar */
.toolbar {
  display: flex; flex-direction: column; gap: .5rem;
  margin-bottom: 1rem; padding: .6rem .75rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  font-size: .825rem;
}
.toolbar-row {
  display: flex; gap: .75rem; flex-wrap: wrap; align-items: center;
}
.toolbar label { color: var(--muted); margin-right: .15rem; }
.toolbar select {
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 4px; padding: .25rem .4rem; font-size: .8rem; cursor: pointer;
}
.toolbar select:focus, .toolbar input:focus { border-color: var(--accent); outline: none; }
.toolbar input[type="text"] {
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 4px; padding: .25rem .4rem; font-size: .8rem; flex: 1; min-width: 8rem;
}
.toolbar .sep { border-left: 1px solid var(--border); height: 1.2rem; }
.toolbar .result-count { color: var(--muted); margin-left: auto; }

.stats { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
.stat {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: .6rem 1rem; font-size: .85rem; cursor: pointer; user-select: none;
  transition: border-color .15s;
}
.stat:hover, .stat.active { border-color: var(--accent); }
.stat.active { background: #1a2233; }
.stat strong { display: block; font-size: 1.2rem; }

/* file groups */
.file-group { margin-bottom: 1.25rem; }
.file-group.hidden { display: none; }
.file-header {
  font-size: .9rem; font-weight: 600; padding: .5rem .75rem;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px 6px 0 0; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
}
.file-header .count { user-select: none; }
.file-header:hover { border-color: var(--accent); }
.file-header a { color: var(--text); }
.file-header a:hover { color: var(--accent); }
.file-header .count { color: var(--muted); font-weight: 400; font-size: .8rem; }
.file-body { border: 1px solid var(--border); border-top: none; border-radius: 0 0 6px 6px; }

.finding {
  padding: .75rem; border-bottom: 1px solid var(--border);
  font-size: .875rem; display: grid; grid-template-columns: auto 1fr; gap: .25rem .75rem;
}
.finding:last-child { border-bottom: none; }
.finding.is-critical { background: var(--critical-bg); }
.finding.hidden { display: none; }

.finding-left { align-self: start; text-align: center; min-width: 4rem; }
.badge {
  display: inline-block; font-size: .7rem; font-weight: 600; text-transform: uppercase;
  padding: .15rem .45rem; border-radius: 3px; letter-spacing: .03em; line-height: 1;
}
.badge.critical { background: var(--critical); color: #fff; }
.badge.high { background: var(--high); color: #fff; }
.badge.medium { background: var(--medium); color: #000; }
.badge.low { background: var(--low); color: #000; }
.conf-score { font-size: .75rem; color: var(--muted); margin-top: .3rem; }
.conf-score strong { color: var(--text); font-size: .85rem; }

.finding .desc { grid-column: 2; }
.finding .line-num { color: var(--muted); font-size: .8rem; }
.finding .recommendation { color: var(--green); margin-top: .25rem; font-size: .825rem; grid-column: 2; }
.finding .conf-reason { color: var(--muted); font-size: .8rem; margin-top: .2rem; grid-column: 2; }
.finding .hashes { color: var(--muted); font-size: .75rem; margin-top: .2rem; grid-column: 2; word-break: break-all; }

.reset-btn {
  display: inline-block; margin-top: 1.5rem; padding: .4rem .9rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); font-size: .85rem; cursor: pointer;
}
.reset-btn:hover { border-color: var(--accent); }
</style>
</head>
<body>

<div id="drop-zone">
  <div class="drop-prompt">
    <h1>deepview results viewer</h1>
    <p>Drop a JSON results file here to visualize it</p>
  </div>
</div>

<div id="report"></div>

<script>
'use strict'

const SEVERITY_ORDER = { critical: 4, high: 3, medium: 2, low: 1 }
const NODE_MODULES_RE = /(^|\/)node_modules\//
const dropZone = document.getElementById('drop-zone')
const report = document.getElementById('report')

let currentData = null
let currentFileName = ''
let filterSeverity = 'all'
let filterSource = 'all'
let filterConfMin = 8
let filterConfMax = ''
let filterInclude = ''
let filterExclude = ''
let repoUrl = ''
let sortBy = 'file'

// Prevent default drag behavior everywhere
document.addEventListener('dragover', (e) => e.preventDefault())
document.addEventListener('drop', (e) => e.preventDefault())

dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('hover') })
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'))
dropZone.addEventListener('drop', (e) => {
  e.preventDefault()
  dropZone.classList.remove('hover')
  const file = e.dataTransfer.files[0]
  if (file) readFile(file)
})

function readFile(file) {
  const reader = new FileReader()
  reader.onload = () => {
    try {
      currentData = JSON.parse(reader.result)
      currentFileName = file.name
      filterSeverity = 'all'
      filterSource = 'all'
      filterConfMin = 8
      filterConfMax = ''
      filterInclude = ''
      filterExclude = ''
      sortBy = 'file'
      render()
    } catch (err) {
      alert('Failed to parse JSON: ' + err.message)
    }
  }
  reader.readAsText(file)
}

function esc(str) {
  const el = document.createElement('span')
  el.textContent = str
  return el.innerHTML
}

function isModule(file) { return NODE_MODULES_RE.test(file) }

function fileUrl(file) {
  if (!repoUrl || isModule(file)) return null
  const base = repoUrl.replace(/\/$/u, '')
  return `${base}/blob/HEAD/${file}`
}

function fileLink(file) {
  const url = fileUrl(file)
  return url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(file)}</a>` : esc(file)
}

function lineLink(file, line) {
  const url = fileUrl(file)
  const text = `line ${esc(String(line))}`
  if (!url) return text
  const lineNum = parseInt(line, 10)
  const lineRange = line.includes('-') || line.includes('\u2013')
    ? `L${lineNum}`
    : `L${lineNum}`
  return `<a href="${esc(url)}#${lineRange}" target="_blank" rel="noopener">${text}</a>`
}

function findingText(f) {
  return [f.file, f.description, f.recommendation, f.confidenceReason, f.discoveredIn].filter(Boolean).join('\n').toLowerCase()
}

function applyFilters(findings) {
  const inc = filterInclude.toLowerCase()
  const exc = filterExclude.toLowerCase()
  return findings.filter((f) => {
    if (filterSeverity !== 'all' && f.severity !== filterSeverity) return false
    if (filterSource === 'own' && isModule(f.file)) return false
    if (filterSource === 'modules' && !isModule(f.file)) return false
    if (filterConfMin !== '' && (f.confidence === undefined || f.confidence < filterConfMin)) return false
    if (filterConfMax !== '' && (f.confidence === undefined || f.confidence > filterConfMax)) return false
    if (inc) { const text = findingText(f); if (!text.includes(inc)) return false }
    if (exc) { const text = findingText(f); if (text.includes(exc)) return false }
    return true
  })
}

function applySorting(findings) {
  const sorted = [...findings]
  if (sortBy === 'severity') {
    sorted.sort((a, b) => (SEVERITY_ORDER[b.severity] || 0) - (SEVERITY_ORDER[a.severity] || 0) || a.file.localeCompare(b.file) || parseInt(a.line) - parseInt(b.line))
  } else if (sortBy === 'confidence-desc') {
    sorted.sort((a, b) => (b.confidence ?? -1) - (a.confidence ?? -1) || a.file.localeCompare(b.file))
  } else if (sortBy === 'confidence-asc') {
    sorted.sort((a, b) => (a.confidence ?? 11) - (b.confidence ?? 11) || a.file.localeCompare(b.file))
  }
  // 'file' sorting is handled by the grouping below
  return sorted
}

function render() {
  const data = currentData
  if (!data) return
  const allFindings = data.findings || []
  const type = data.type || 'analysis'

  // Counts always reflect all findings
  const counts = { critical: 0, high: 0, medium: 0, low: 0 }
  for (const f of allFindings) counts[f.severity] = (counts[f.severity] || 0) + 1

  const filtered = applySorting(applyFilters(allFindings))

  let html = '<header>'
  html += `<h1>${esc(type)} results</h1>`
  html += `<div class="meta">${esc(currentFileName)} &mdash; ${allFindings.length} finding${allFindings.length !== 1 ? 's' : ''}</div>`
  html += '</header>'

  // Stats — clickable severity filter
  html += '<div class="stats">'
  const statItems = [
    ['critical', counts.critical, '--critical'],
    ['high', counts.high, '--high'],
    ['medium', counts.medium, '--medium'],
    ['low', counts.low, '--low'],
  ]
  for (const [sev, count, color] of statItems) {
    if (!count) continue
    const active = filterSeverity === sev ? ' active' : ''
    html += `<div class="stat${active}" onclick="toggleSeverity('${sev}')"><strong style="color:var(${color})">${count}</strong>${sev}</div>`
  }
  html += '</div>'

  // Toolbar
  html += '<div class="toolbar">'
  html += '<div class="toolbar-row">'
  html += `<label for="sort-select">Sort:</label>`
  html += `<select id="sort-select" onchange="setSort(this.value)">`
  html += `<option value="file"${sortBy === 'file' ? ' selected' : ''}>By file</option>`
  html += `<option value="severity"${sortBy === 'severity' ? ' selected' : ''}>By severity</option>`
  html += `<option value="confidence-desc"${sortBy === 'confidence-desc' ? ' selected' : ''}>Confidence (high first)</option>`
  html += `<option value="confidence-asc"${sortBy === 'confidence-asc' ? ' selected' : ''}>Confidence (low first)</option>`
  html += `</select>`
  html += `<div class="sep"></div>`
  html += `<label for="source-select">Source:</label>`
  html += `<select id="source-select" onchange="setSource(this.value)">`
  html += `<option value="all"${filterSource === 'all' ? ' selected' : ''}>All files</option>`
  html += `<option value="own"${filterSource === 'own' ? ' selected' : ''}>Own source</option>`
  html += `<option value="modules"${filterSource === 'modules' ? ' selected' : ''}>node_modules</option>`
  html += `</select>`
  html += `<div class="sep"></div>`
  html += `<label for="conf-min">Confidence:</label>`
  html += `<select id="conf-min" onchange="setConfMin(this.value)">`
  html += `<option value="">min</option>`
  for (let i = 0; i <= 10; i++) html += `<option value="${i}"${filterConfMin === i ? ' selected' : ''}>${i}</option>`
  html += `</select>`
  html += ` &ndash; `
  html += `<select id="conf-max" onchange="setConfMax(this.value)">`
  html += `<option value="">max</option>`
  for (let i = 0; i <= 10; i++) html += `<option value="${i}"${filterConfMax === i ? ' selected' : ''}>${i}</option>`
  html += `</select>`
  html += `<span class="result-count">${filtered.length} of ${allFindings.length}</span>`
  html += '</div>'
  html += '<div class="toolbar-row">'
  html += `<label for="filter-include">Include:</label>`
  html += `<input type="text" id="filter-include" value="${esc(filterInclude)}" oninput="setInclude(this.value)" placeholder="match text">`
  html += `<label for="filter-exclude">Exclude:</label>`
  html += `<input type="text" id="filter-exclude" value="${esc(filterExclude)}" oninput="setExclude(this.value)" placeholder="hide text">`
  html += '</div>'
  html += '<div class="toolbar-row">'
  html += `<label for="repo-url">Repo:</label>`
  html += `<input type="text" id="repo-url" value="${esc(repoUrl)}" oninput="setRepoUrl(this.value)" placeholder="https://github.com/user/repo">`
  html += '</div>'
  html += '</div>'

  if (filtered.length === 0 && allFindings.length > 0) {
    html += `<p style="color:var(--muted); margin: 1rem 0;">No findings match the current filters.</p>`
  } else if (allFindings.length === 0) {
    html += `<p style="color:var(--green)">No ${esc(type)} issues found.</p>`
  }

  // Group by file, preserving sort order within groups
  const byFile = new Map()
  for (const f of filtered) {
    if (!byFile.has(f.file)) byFile.set(f.file, [])
    byFile.get(f.file).push(f)
  }

  // For file sort, sort groups alphabetically; otherwise preserve first-appearance order
  const fileKeys = sortBy === 'file' ? [...byFile.keys()].sort() : [...byFile.keys()]

  for (const file of fileKeys) {
    const items = sortBy === 'file'
      ? byFile.get(file).sort((a, b) => parseInt(a.line) - parseInt(b.line))
      : byFile.get(file)
    html += '<div class="file-group">'
    html += `<div class="file-header" onclick="if(event.target.tagName!=='A')this.parentElement.classList.toggle('collapsed')"><span>${fileLink(file)}</span><span class="count">${items.length}</span></div>`
    html += '<div class="file-body">'
    for (const f of items) {
      const isCritical = f.critical || f.severity === 'critical'
      html += `<div class="finding${isCritical ? ' is-critical' : ''}">`
      html += '<div class="finding-left">'
      html += `<span class="badge ${esc(f.severity)}">${esc(f.severity)}</span>`
      if (f.confidence !== undefined) html += `<div class="conf-score"><strong>${f.confidence}</strong>/10</div>`
      html += '</div>'
      html += '<div>'
      html += `<span class="line-num">${lineLink(f.file, f.line)}</span>`
      if (f.discoveredIn) html += ` <span class="line-num">(found analyzing ${esc(f.discoveredIn)})</span>`
      html += `<div class="desc">${esc(f.description)}</div>`
      if (f.recommendation) html += `<div class="recommendation">Recommendation: ${esc(f.recommendation)}</div>`
      if (f.confidenceReason) html += `<div class="conf-reason">${esc(f.confidenceReason)}</div>`
      if (f.fileHash || f.treeHash) {
        const parts = []
        if (f.fileHash) parts.push(`file: ${esc(f.fileHash)}`)
        if (f.treeHash) parts.push(`tree: ${esc(f.treeHash)}`)
        html += `<div class="hashes">${parts.join(' | ')}</div>`
      }
      html += '</div></div>'
    }
    html += '</div></div>'
  }

  html += '<button class="reset-btn" onclick="resetView()">Load another file</button>'

  report.innerHTML = html
  report.classList.add('active')
  dropZone.classList.add('hidden')
  document.title = `${type} results - deepview`
}

function toggleSeverity(sev) {
  filterSeverity = filterSeverity === sev ? 'all' : sev
  render()
}

function setSort(value) {
  sortBy = value
  render()
}

function setSource(value) {
  filterSource = value
  render()
}

function setConfMin(value) {
  filterConfMin = value === '' ? '' : parseInt(value, 10)
  render()
}

function setConfMax(value) {
  filterConfMax = value === '' ? '' : parseInt(value, 10)
  render()
}

function setInclude(value) {
  filterInclude = value
  renderKeepFocus('filter-include')
}

function setExclude(value) {
  filterExclude = value
  renderKeepFocus('filter-exclude')
}

function setRepoUrl(value) {
  repoUrl = value
  renderKeepFocus('repo-url')
}

function renderKeepFocus(inputId) {
  const prev = document.getElementById(inputId)
  const pos = prev ? prev.selectionStart : 0
  render()
  const el = document.getElementById(inputId)
  if (el) { el.focus(); el.setSelectionRange(pos, pos) }
}

function resetView() {
  currentData = null
  report.classList.remove('active')
  report.innerHTML = ''
  dropZone.classList.remove('hidden')
  document.title = 'deepview results'
}
</script>
</body>
</html>
