<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'none'">
<title>deepview results</title>
<link href="./view.css" rel="stylesheet" />
<script src="./view.js" type="module" defer></script>
</head>
<body>

<theme-toggle></theme-toggle>
<button id="print-btn" type="button" title="print this report" aria-label="print">
  <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
    <path d="M5 2h6v3H5z"/>
    <path d="M3 5h10a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-1v-2H4v2H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 2.5a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/>
    <path d="M5 10h6v4H5z"/>
  </svg>
</button>

<aside id="sidebar">
  <div class="sidebar-header">
    <h2 class="brand">
      <span class="brand-name">DeepView</span>
      <span class="brand-tag">dev</span>
    </h2>
    <button id="sidebar-toggle" type="button" title="toggle sidebar" aria-label="toggle sidebar">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
        <path d="M2 4h12v1.5H2zM2 7.25h12v1.5H2zM2 10.5h12V12H2z"/>
      </svg>
    </button>
  </div>
  <div class="sidebar-search">
    <svg class="sidebar-search-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <circle cx="6.5" cy="6.5" r="4.5"/>
      <path d="M9.7 9.7L13 13" stroke-linecap="round"/>
    </svg>
    <input id="sidebar-search-input" type="search" placeholder="Search reports..." autocomplete="off">
  </div>
  <ul id="file-list"></ul>
  <div class="sidebar-actions">
    <button id="delete-current" type="button" class="danger" title="delete the current report from storage">Delete current</button>
    <button id="sync-status" type="button" data-status="off" title="Sync off — click to enable (localhost)">
      <span class="sync-dot" aria-hidden="true"></span>
      <span class="sync-label">Sync off</span>
    </button>
  </div>
</aside>

<main id="main-content">
  <div id="drop-zone">
    <div class="drop-prompt">
      <h1>deepview results viewer</h1>
      <p>Drop a JSON results file here, or pick one from the sidebar</p>
    </div>
  </div>
  <div id="report"></div>
</main>

</body>
</html>
