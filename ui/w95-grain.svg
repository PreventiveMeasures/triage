<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0">
  <!-- The W95 theme's grain (styles/w95.css), for 2 and 3 device pixels to
       the CSS pixel: one device pixel sampled a CSS pixel apart, then
       copied a whole device pixel at a time across the rest of its square,
       so each CSS pixel shows as one solid block. sRGB, so the colours
       come through unchanged. -->
  <filter id="w95-grain-2" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feFlood x="0" y="0" width="0.5" height="0.5"/>
    <feComposite width="1" height="1"/>
    <feTile/>
    <feComposite in="SourceGraphic" operator="in" result="dot"/>
    <feOffset in="dot" dx="0.5" result="d1"/>
    <feOffset in="dot" dy="0.5" result="d2"/>
    <feOffset in="dot" dx="0.5" dy="0.5" result="d3"/>
    <feMerge><feMergeNode in="dot"/><feMergeNode in="d1"/><feMergeNode in="d2"/><feMergeNode in="d3"/></feMerge>
  </filter>
  <filter id="w95-grain-3" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feFlood x="0" y="0" width="0.333333" height="0.333333"/>
    <feComposite width="1" height="1"/>
    <feTile/>
    <feComposite in="SourceGraphic" operator="in" result="dot"/>
    <feOffset in="dot" dx="0.333333" result="d1"/>
    <feOffset in="dot" dx="0.666667" result="d2"/>
    <feOffset in="dot" dy="0.333333" result="d3"/>
    <feOffset in="dot" dx="0.333333" dy="0.333333" result="d4"/>
    <feOffset in="dot" dx="0.666667" dy="0.333333" result="d5"/>
    <feOffset in="dot" dy="0.666667" result="d6"/>
    <feOffset in="dot" dx="0.333333" dy="0.666667" result="d7"/>
    <feOffset in="dot" dx="0.666667" dy="0.666667" result="d8"/>
    <feMerge><feMergeNode in="dot"/><feMergeNode in="d1"/><feMergeNode in="d2"/><feMergeNode in="d3"/><feMergeNode in="d4"/><feMergeNode in="d5"/><feMergeNode in="d6"/><feMergeNode in="d7"/><feMergeNode in="d8"/></feMerge>
  </filter>
</svg>
