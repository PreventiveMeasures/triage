<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; manifest-src 'self'; form-action 'none'; connect-src 'self'">
<title>deepview results</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icon.svg" />
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#1a1a1b" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="DeepView" />
<link rel="preload" href="./view.css" as="style" />
<link rel="modulepreload" href="./view.js" />
<link href="./view.css" rel="stylesheet" />
<script src="./view.js" type="module" defer></script>
</head>
<body>

<theme-toggle></theme-toggle>
<button id="print-btn" type="button" title="print this report" aria-label="print">
  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <path d="M6 9V2h12v7"/>
    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
    <rect x="6" y="14" width="12" height="8"/>
  </svg>
</button>
<button id="download-btn" type="button" title="download this report" aria-label="download">
  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="7 10 12 15 17 10"/>
    <line x1="12" x2="12" y1="15" y2="3"/>
  </svg>
</button>

<!-- WCO duplicate of the sidebar-header. Hidden by default; shown
     via CSS only when `@media (display-mode: window-controls-overlay)`
     matches. Lives outside #sidebar so it escapes #sidebar's stacking
     context (which is trapped under the page-level fixed backdrops
     by the sidebar's own backdrop-filter). Only the brand is
     duplicated — the interactive buttons (sidebar-toggle,
     encryption-toggle) stay single-instance in the in-sidebar
     header. The drag-handle / OS-controls-landing strip is what
     this duplicate exists to provide; the actual lock + hamburger
     buttons are still functional through the regular sidebar
     header (visible underneath since both occupy the same column
     position). -->
<div class="sidebar-header sidebar-header-wco" aria-hidden="true">
  <h2 class="brand">
    <span class="brand-name">DeepView</span>
    <span class="brand-tag">dev</span>
  </h2>
</div>

<aside id="sidebar">
  <div class="sidebar-header">
    <h2 class="brand">
      <span class="brand-name">DeepView</span>
      <span class="brand-tag">dev</span>
    </h2>
    <button id="encryption-toggle" type="button" hidden></button>
    <button id="sidebar-toggle" type="button" title="toggle sidebar" aria-label="toggle sidebar">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
        <path d="M2 4h12v1.5H2zM2 7.25h12v1.5H2zM2 10.5h12V12H2z"/>
      </svg>
    </button>
  </div>
  <div class="sidebar-search">
    <svg class="sidebar-search-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <circle cx="6.5" cy="6.5" r="4.5"/>
      <path d="M9.7 9.7L13 13" stroke-linecap="round"/>
    </svg>
    <input id="sidebar-search-input" type="search" placeholder="Search reports..." autocomplete="off">
    <button id="show-packages-btn" type="button" class="sidebar-view-btn" data-action="show-packages" hidden title="Show packages" aria-label="Show packages">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 6h12v7a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6Z"/>
        <path d="M2 6l1.6-3.3A1.3 1.3 0 0 1 4.8 2h6.4a1.3 1.3 0 0 1 1.2.7L14 6"/>
        <path d="M8 2v4"/>
      </svg>
      <span class="view-btn-count"></span>
    </button>
    <button id="show-repositories-btn" type="button" class="sidebar-view-btn" data-action="show-repositories" hidden title="Show repositories" aria-label="Show repositories">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="4" x2="4" y1="2.5" y2="10"/>
        <circle cx="12" cy="4" r="2"/>
        <circle cx="4" cy="12" r="2"/>
        <path d="M12 6a6 6 0 0 1-6 6"/>
      </svg>
      <span class="view-btn-count"></span>
    </button>
  </div>
  <ul id="file-list"></ul>
  <div class="sidebar-actions">
    <button id="delete-current" type="button" class="danger">
      <svg class="trash-icon" viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h10M6.5 4V2.5h3V4M5 4l.7 9h4.6L11 4"/></svg>
      <span>Delete current</span>
    </button>
    <button id="sync-status" type="button" data-status="off">
      <span class="sync-dot" aria-hidden="true"></span>
      <span class="sync-label">Sync off</span>
    </button>
  </div>
</aside>

<main id="main-content">
  <div id="drop-zone" role="button" tabindex="0" aria-label="Drop reports here or click to browse for files">
    <div class="drop-prompt">
      <h1>deepview results viewer</h1>
      <p>Drop a JSON results file here, <span class="drop-prompt-action">click to browse</span>, or pick one from the sidebar</p>
    </div>
  </div>
  <div id="report"></div>
</main>

<!-- Bundle source viewer overlay — rendered globally (sibling of
     #main-content) so the [Code →] shortcut on a finding can pop
     the same modal regardless of which view the user is on,
     without having to switch them to the bundles view first.
     Kept empty until render() puts the modal HTML in. -->
<div id="bundle-source-overlay-slot"></div>

</body>
</html>
