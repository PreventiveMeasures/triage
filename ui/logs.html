<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-1'; style-src 'unsafe-inline'; form-action 'none'">
<title>deepview logs</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117; --surface: #161b22; --surface2: #1c2128; --border: #30363d; --text: #e6edf3;
  --muted: #8b949e; --accent: #58a6ff; --green: #3fb950; --orange: #f0883e;
  --user: #58a6ff; --assistant: #a371f7; --tool: #d29922; --thinking: #8b949e;
  --system: #6e7681; --summary: #3fb950; --error: #f85149;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5;
}
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
a { color: var(--accent); text-decoration: none; }

/* drop zone */
#drop-zone {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; padding: 2rem;
}
#drop-zone.hover { background: #1a2233; }
.drop-prompt { text-align: center; color: var(--muted); }
.drop-prompt h1 { font-size: 1.4rem; margin-bottom: .5rem; color: var(--text); }
.drop-prompt p { font-size: .95rem; }
.error { color: var(--error); margin-top: 1rem; font-size: .9rem; }

/* viewer */
#viewer { display: none; max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
#viewer.active { display: block; }
#drop-zone.hidden { display: none; }

header { margin-bottom: 1rem; }
header h1 { font-size: 1.3rem; }
header .meta { color: var(--muted); font-size: .85rem; margin-top: .25rem; }

/* toolbar */
.toolbar {
  display: flex; gap: .75rem; flex-wrap: wrap; align-items: center;
  margin-bottom: 1rem; padding: .6rem .75rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  font-size: .825rem;
}
.toolbar label { color: var(--muted); display: inline-flex; align-items: center; gap: .3rem; cursor: pointer; }
.toolbar input[type="text"] {
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 4px; padding: .25rem .4rem; font-size: .8rem; flex: 1; min-width: 10rem;
}
.toolbar input[type="text"]:focus { border-color: var(--accent); outline: none; }
.toolbar .result-count { color: var(--muted); margin-left: auto; }
.toolbar .sep { border-left: 1px solid var(--border); height: 1.2rem; }

/* tabs */
.tabs {
  display: flex; gap: .25rem; overflow-x: auto; margin-bottom: 1rem;
  border-bottom: 1px solid var(--border); padding-bottom: 0;
}
.tab {
  background: transparent; border: 1px solid transparent; border-bottom: none;
  color: var(--muted); padding: .4rem .75rem; cursor: pointer; font-size: .825rem;
  border-radius: 6px 6px 0 0; white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.active {
  background: var(--surface); border-color: var(--border);
  color: var(--text); position: relative; top: 1px;
}
.tab .count { color: var(--muted); margin-left: .4rem; font-size: .75rem; }
.tab.active .count { color: var(--accent); }

/* entries */
.entries { display: flex; flex-direction: column; gap: .5rem; }
.entry {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: .6rem .75rem; font-size: .875rem;
}
.entry.hidden { display: none; }
.entry-meta {
  display: flex; gap: .5rem; align-items: center; margin-bottom: .4rem;
  font-size: .75rem; color: var(--muted);
}
.entry-meta .time { margin-left: auto; }
.badge {
  display: inline-block; font-size: .7rem; font-weight: 600; text-transform: uppercase;
  padding: .15rem .45rem; border-radius: 3px; letter-spacing: .03em; line-height: 1.2;
  background: var(--surface2); border: 1px solid var(--border);
}
.badge.user { color: var(--user); border-color: var(--user); }
.badge.assistant { color: var(--assistant); border-color: var(--assistant); }
.badge.tool_use { color: var(--tool); border-color: var(--tool); }
.badge.tool_result { color: var(--tool); border-color: var(--tool); }
.badge.thinking { color: var(--thinking); border-color: var(--thinking); }
.badge.system { color: var(--system); border-color: var(--system); }
.badge.summary { color: var(--summary); border-color: var(--summary); }

.text-block {
  white-space: pre-wrap; word-wrap: break-word; font-size: .875rem;
}
.text-block + .text-block, .text-block + details, details + .text-block, details + details {
  margin-top: .4rem;
}

/* tool blocks */
details.tool {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 4px;
  padding: .3rem .5rem; font-size: .825rem;
}
details.tool[open] { padding-bottom: .5rem; }
details.tool > summary {
  cursor: pointer; list-style: none; user-select: none;
  display: flex; gap: .4rem; align-items: baseline;
}
details.tool > summary::-webkit-details-marker { display: none; }
details.tool > summary::before {
  content: '▶'; font-size: .6rem; color: var(--muted); transition: transform .1s;
}
details.tool[open] > summary::before { transform: rotate(90deg); }
details.tool .tool-name { font-weight: 600; color: var(--tool); }
details.tool.error .tool-name { color: var(--error); }
details.tool .tool-preview { color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
details.tool pre {
  margin-top: .4rem; padding: .5rem; background: var(--bg); border-radius: 4px;
  font-size: .8rem; white-space: pre-wrap; word-wrap: break-word; max-height: 30rem; overflow: auto;
}

.thinking-block {
  color: var(--thinking); font-style: italic; white-space: pre-wrap;
  border-left: 2px solid var(--thinking); padding-left: .6rem; font-size: .85rem;
}

.summary-text { color: var(--summary); font-weight: 500; }

.reset-btn {
  display: inline-block; margin-top: 1.5rem; padding: .4rem .9rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); font-size: .85rem; cursor: pointer;
}
.reset-btn:hover { border-color: var(--accent); }
</style>
</head>
<body>

<div id="drop-zone">
  <div class="drop-prompt">
    <h1>deepview logs viewer</h1>
    <p>Drop a deepfix log JSON file here to visualize it</p>
    <p id="drop-error" class="error"></p>
  </div>
</div>

<div id="viewer"></div>

<script nonce="1">
'use strict'

const dropZone = document.getElementById('drop-zone')
const dropError = document.getElementById('drop-error')
const viewer = document.getElementById('viewer')

const TOOL_PREVIEW_KEYS = ['command', 'file_path', 'path', 'pattern', 'prompt', 'description', 'query', 'url']

let currentData = null
let currentFileName = ''
let currentTab = null
let filterText = ''
let showTools = true
let showThinking = true
let showSystem = false

document.addEventListener('dragover', (e) => e.preventDefault())
document.addEventListener('drop', (e) => e.preventDefault())

dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('hover') })
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'))
dropZone.addEventListener('drop', (e) => {
  e.preventDefault()
  dropZone.classList.remove('hover')
  const file = e.dataTransfer.files[0]
  if (file) readFile(file)
})

function readFile(file) {
  const reader = new FileReader()
  reader.onload = () => {
    let parsed
    try {
      parsed = JSON.parse(reader.result)
    } catch (err) {
      showDropError(`Failed to parse JSON: ${err.message}`)
      return
    }
    const format = detectFormat(parsed)
    if (format !== 'deepfix-log') {
      showDropError('Unsupported format. Expected a deepfix log: { "file": [...entries] }')
      return
    }
    currentData = parsed
    currentFileName = file.name
    currentTab = Object.keys(parsed)[0] || null
    filterText = ''
    dropError.textContent = ''
    render()
  }
  reader.readAsText(file)
}

function showDropError(msg) { dropError.textContent = msg }

// Detect deepfix log format: top-level object where every value is an array of
// entries, and entries (when present) have a string `type` field.
function detectFormat(data) {
  if (!data || typeof data !== 'object' || Array.isArray(data)) return null
  const values = Object.values(data)
  if (values.length === 0) return null
  if (!values.every((v) => Array.isArray(v))) return null
  for (const list of values) {
    if (list.length === 0) continue
    const first = list[0]
    if (!first || typeof first !== 'object' || typeof first.type !== 'string') return null
    return 'deepfix-log'
  }
  // All empty arrays — still a valid (degenerate) deepfix log
  return 'deepfix-log'
}

const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }
function esc(str) {
  if (str == null) return ''
  return String(str).replace(/[&<>"']/gu, (c) => ESC_MAP[c])
}

function formatTime(ts) {
  if (!ts) return ''
  const d = new Date(ts)
  if (isNaN(d.getTime())) return ''
  return d.toLocaleTimeString('en-US', { hour12: false })
}

function stringifyJSON(value) {
  try { return JSON.stringify(value, null, 2) } catch { return String(value) }
}

// Pick a short single-line preview for a tool input/result.
function toolInputPreview(input) {
  if (input == null) return ''
  if (typeof input === 'string') return input.split('\n')[0].slice(0, 200)
  if (typeof input !== 'object') return String(input)
  for (const k of TOOL_PREVIEW_KEYS) {
    if (k in input && typeof input[k] === 'string') return `${k}: ${input[k].split('\n')[0].slice(0, 200)}`
  }
  return Object.keys(input).join(', ')
}

function toolResultPreview(content) {
  if (content == null) return ''
  if (typeof content === 'string') return content.split('\n')[0].slice(0, 200)
  if (Array.isArray(content)) {
    // Anthropic tool_result content: [{ type: 'text', text: '...' }]
    const first = content.find((b) => b && b.type === 'text')
    if (first && typeof first.text === 'string') return first.text.split('\n')[0].slice(0, 200)
    return `${content.length} block${content.length === 1 ? '' : 's'}`
  }
  return stringifyJSON(content).split('\n')[0].slice(0, 200)
}

function toolResultText(content) {
  if (content == null) return ''
  if (typeof content === 'string') return content
  if (Array.isArray(content)) {
    return content.map((b) => (b && typeof b === 'object' && b.type === 'text') ? b.text : stringifyJSON(b)).join('\n\n')
  }
  return stringifyJSON(content)
}

// Extract a flat list of renderable blocks from an entry.
//   kind: 'text' | 'tool_use' | 'tool_result' | 'thinking' | 'summary' | 'system' | 'unknown'
function blocksOf(entry) {
  const out = []
  if (entry.type === 'summary') {
    if (entry.summary) out.push({ kind: 'summary', text: String(entry.summary) })
    return out
  }
  if (entry.type === 'system') {
    if (entry.content) out.push({ kind: 'system', text: String(entry.content) })
    else if (entry.message) out.push({ kind: 'system', text: stringifyJSON(entry.message) })
    return out
  }
  const msg = entry.message
  if (!msg) return out
  const content = msg.content
  if (typeof content === 'string') {
    out.push({ kind: 'text', text: content })
    return out
  }
  if (!Array.isArray(content)) return out
  for (const b of content) {
    if (!b || typeof b !== 'object') continue
    if (b.type === 'text' && typeof b.text === 'string') out.push({ kind: 'text', text: b.text })
    else if (b.type === 'thinking' && typeof b.thinking === 'string') out.push({ kind: 'thinking', text: b.thinking })
    else if (b.type === 'tool_use') out.push({ kind: 'tool_use', name: b.name || '(tool)', input: b.input, id: b.id })
    else if (b.type === 'tool_result') out.push({ kind: 'tool_result', content: b.content, isError: b.is_error === true, id: b.tool_use_id })
    else out.push({ kind: 'unknown', text: stringifyJSON(b) })
  }
  return out
}

// Which entry-type badge to show. If the entry only contains tool_use, label
// it as such; same for tool_result. Otherwise use the raw `type`.
function entryBadge(entry, blocks) {
  if (entry.type === 'user' && blocks.every((b) => b.kind === 'tool_result')) return 'tool_result'
  if (entry.type === 'assistant' && blocks.every((b) => b.kind === 'tool_use' || b.kind === 'thinking')) {
    if (blocks.some((b) => b.kind === 'tool_use')) return 'tool_use'
  }
  return entry.type
}

function entryMatchesFilter(entry, blocks, needle) {
  if (!needle) return true
  for (const b of blocks) {
    if (b.kind === 'text' || b.kind === 'thinking' || b.kind === 'summary' || b.kind === 'system' || b.kind === 'unknown') {
      if (b.text && b.text.toLowerCase().includes(needle)) return true
    } else if (b.kind === 'tool_use') {
      if (b.name.toLowerCase().includes(needle)) return true
      if (stringifyJSON(b.input).toLowerCase().includes(needle)) return true
    } else if (b.kind === 'tool_result') {
      if (toolResultText(b.content).toLowerCase().includes(needle)) return true
    }
  }
  return false
}

function entryVisible(entry, blocks) {
  if (entry.type === 'system' && !showSystem) return false
  const onlyTools = blocks.length > 0 && blocks.every((b) => b.kind === 'tool_use' || b.kind === 'tool_result')
  if (onlyTools && !showTools) return false
  const onlyThinking = blocks.length > 0 && blocks.every((b) => b.kind === 'thinking')
  if (onlyThinking && !showThinking) return false
  return true
}

function renderBlock(block) {
  if (block.kind === 'text') return `<div class="text-block">${esc(block.text)}</div>`
  if (block.kind === 'summary') return `<div class="text-block summary-text">${esc(block.text)}</div>`
  if (block.kind === 'system') return `<div class="text-block" style="color:var(--muted); font-size:.825rem;">${esc(block.text)}</div>`
  if (block.kind === 'thinking') {
    if (!showThinking) return ''
    return `<div class="thinking-block">${esc(block.text)}</div>`
  }
  if (block.kind === 'tool_use') {
    if (!showTools) return ''
    const preview = toolInputPreview(block.input)
    return `<details class="tool"><summary><span class="tool-name">🔧 ${esc(block.name)}</span><span class="tool-preview">${esc(preview)}</span></summary><pre>${esc(stringifyJSON(block.input))}</pre></details>`
  }
  if (block.kind === 'tool_result') {
    if (!showTools) return ''
    const preview = toolResultPreview(block.content)
    const cls = block.isError ? 'tool error' : 'tool'
    const label = block.isError ? '✗ error' : '✓ result'
    return `<details class="${cls}"><summary><span class="tool-name">${label}</span><span class="tool-preview">${esc(preview)}</span></summary><pre>${esc(toolResultText(block.content))}</pre></details>`
  }
  return `<div class="text-block" style="color:var(--muted);">${esc(block.text || '')}</div>`
}

function render() {
  if (!currentData) return
  const files = Object.keys(currentData)
  if (!files.includes(currentTab)) currentTab = files[0] || null

  const totalEntries = files.reduce((n, f) => n + currentData[f].length, 0)
  const needle = filterText.trim().toLowerCase()

  let html = '<header>'
  html += `<h1>deepfix logs</h1>`
  html += `<div class="meta">${esc(currentFileName)} &mdash; ${files.length} file${files.length === 1 ? '' : 's'}, ${totalEntries} entr${totalEntries === 1 ? 'y' : 'ies'}</div>`
  html += '</header>'

  // Toolbar
  html += '<div class="toolbar">'
  html += `<input type="text" id="filter-text" value="${esc(filterText)}" placeholder="search text, tool names, arguments...">`
  html += `<div class="sep"></div>`
  html += `<label><input type="checkbox" id="toggle-tools"${showTools ? ' checked' : ''}> tools</label>`
  html += `<label><input type="checkbox" id="toggle-thinking"${showThinking ? ' checked' : ''}> thinking</label>`
  html += `<label><input type="checkbox" id="toggle-system"${showSystem ? ' checked' : ''}> system</label>`
  html += `<span class="result-count" id="result-count"></span>`
  html += '</div>'

  // Tabs
  if (files.length > 1) {
    html += '<div class="tabs">'
    for (const f of files) {
      const active = f === currentTab ? ' active' : ''
      const count = currentData[f].length
      html += `<button class="tab${active}" data-tab="${esc(f)}">${esc(f)}<span class="count">${count}</span></button>`
    }
    html += '</div>'
  }

  // Entries
  html += '<div class="entries" id="entries">'
  const entries = currentTab ? currentData[currentTab] : []
  let visible = 0
  for (let i = 0; i < entries.length; i++) {
    const entry = entries[i]
    const blocks = blocksOf(entry)
    const matches = entryMatchesFilter(entry, blocks, needle)
    const visibleByType = entryVisible(entry, blocks)
    if (!matches || !visibleByType) continue
    visible++
    const badge = entryBadge(entry, blocks)
    const time = formatTime(entry.timestamp)
    html += `<div class="entry type-${esc(badge)}">`
    html += '<div class="entry-meta">'
    html += `<span class="badge ${esc(badge)}">${esc(badge)}</span>`
    if (entry.uuid) html += `<span class="mono" style="font-size:.7rem;">#${esc(String(entry.uuid).slice(0, 8))}</span>`
    if (time) html += `<span class="time">${esc(time)}</span>`
    html += '</div>'
    html += '<div class="entry-body">'
    if (blocks.length === 0) {
      html += `<div class="text-block" style="color:var(--muted);">(no content)</div>`
    } else {
      for (const b of blocks) html += renderBlock(b)
    }
    html += '</div></div>'
  }
  html += '</div>'
  html += `<button class="reset-btn" id="reset-btn">Load another file</button>`

  viewer.innerHTML = html
  viewer.classList.add('active')
  dropZone.classList.add('hidden')
  document.title = `deepfix logs - ${currentFileName}`

  const rc = document.getElementById('result-count')
  if (rc) rc.textContent = `${visible} of ${entries.length}`
}

function renderKeepFocus(inputId) {
  const prev = document.getElementById(inputId)
  const pos = prev ? prev.selectionStart : 0
  render()
  const el = document.getElementById(inputId)
  if (el) { el.focus(); el.setSelectionRange(pos, pos) }
}

function resetView() {
  currentData = null
  currentFileName = ''
  currentTab = null
  viewer.classList.remove('active')
  viewer.innerHTML = ''
  dropZone.classList.remove('hidden')
  dropError.textContent = ''
  document.title = 'deepview logs'
}

viewer.addEventListener('click', (e) => {
  const tab = e.target.closest('[data-tab]')
  if (tab) { currentTab = tab.dataset.tab; render(); return }
  if (e.target.closest('#reset-btn')) { resetView() }
})

viewer.addEventListener('change', (e) => {
  const id = e.target.id
  if (id === 'toggle-tools') { showTools = e.target.checked; render() }
  else if (id === 'toggle-thinking') { showThinking = e.target.checked; render() }
  else if (id === 'toggle-system') { showSystem = e.target.checked; render() }
})

viewer.addEventListener('input', (e) => {
  if (e.target.id === 'filter-text') { filterText = e.target.value; renderKeepFocus('filter-text') }
})
</script>
</body>
</html>
